name: Preview startup real platform launcher

on:
  workflow_dispatch:
    inputs:
      reviewed_ref:
        description: Git branch, tag, or commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-real-launcher:
    name: Verify Expo launcher on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_ref }}
          fetch-depth: 1
          persist-credentials: false
          # The repository contains documentation fixture paths that Git for
          # Windows cannot materialize. This check only needs the workspace
          # packages and launcher validator, so avoid unrelated paths.
          sparse-checkout: |
            /package.json
            /pnpm-lock.yaml
            /pnpm-workspace.yaml
            /.npmrc
            /artifacts/chat-app/
            /lib/
            /vendor/
            /scripts/
          sparse-checkout-cone-mode: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Windows loader diagnosis smoke check
        if: matrix.os == 'windows-latest'
        shell: bash
        run: pnpm --filter @workspace/chat-app run test:preview-loader-windows

      - name: Capture and revalidate real Expo launcher output
        shell: bash
        env:
          PREVIEW_STARTUP_REAL_LAUNCHER: "1"
          PREVIEW_STARTUP_TIMEOUT_MS: "45000"
          PREVIEW_HANDOFF_TIMEOUT_MS: "2000"
          PREVIEW_PUBLIC_TIMEOUT_MS: "2000"
        run: |
          set -euo pipefail
          source scripts/workflow-output-safety.sh
          log_path="$RUNNER_TEMP/expo-startup-${{ matrix.os }}.log"
          console_path="$RUNNER_TEMP/expo-startup-${{ matrix.os }}.console.log"
          record_status=0

          set +e
          node artifacts/chat-app/scripts/validate-preview-startup.mjs \
            --record-log "$log_path" \
            >"$console_path" 2>&1
          record_status=$?
          set -e

          if [[ ! -s "$log_path" ]]; then
            echo "The real Expo launcher did not produce a captured startup log." >&2
            cat "$console_path" >&2
            exit 1
          fi

          if grep -Eiq \
            'authorization|proxy-authorization|password|passwd|secret|token|https?://[^[:space:]]+:[^[:space:]]+@' \
            "$log_path"; then
            echo "The captured launcher output contains credentials or a private URL." >&2
            exit 1
          fi

          set +e
          node artifacts/chat-app/scripts/validate-preview-startup.mjs \
            --log-file "$log_path" \
            >"$RUNNER_TEMP/expo-startup-${{ matrix.os }}.revalidated.log" 2>&1
          revalidation_status=$?
          set -e

          if [[ "$record_status" -eq 0 && "$revalidation_status" -ne 0 ]]; then
            echo "Captured healthy launcher output did not remain healthy when revalidated." >&2
            cat "$RUNNER_TEMP/expo-startup-${{ matrix.os }}.revalidated.log" >&2
            exit 1
          fi

          loader_failure=0
          if grep -Eiq \
            'shared libraries|library not loaded|cannot proceed because .* was not found|react native devtools.*(error|failed|unable|cannot)' \
            "$log_path"; then
            loader_failure=1
          fi

          # A launcher failure is only acceptable evidence when it is a loader
          # failure the validator diagnoses. Any other nonzero status means the
          # run proved nothing about launcher compatibility, so fail loudly
          # instead of publishing a green summary.
          if [[ "$record_status" -ne 0 && "$loader_failure" -eq 0 ]]; then
            echo "The real Expo launcher failed without a recognized loader diagnosis." >&2
            echo "Initial validator status: $record_status" >&2
            cat "$console_path" >&2
            exit 1
          fi

          if [[ "$revalidation_status" -ne 0 && "$loader_failure" -eq 0 ]]; then
            echo "Revalidating the captured output failed without a recognized loader diagnosis." >&2
            echo "Revalidation status: $revalidation_status" >&2
            cat "$RUNNER_TEMP/expo-startup-${{ matrix.os }}.revalidated.log" >&2
            exit 1
          fi

          if [[ "$loader_failure" -eq 1 ]]; then
            live_diagnostic="$(
              sed -n 's/^Expo preview startup error: //p' "$console_path" | head -n 1
            )"
            captured_diagnostic="$(
              sed -n 's/^Expo preview startup error: //p' \
                "$RUNNER_TEMP/expo-startup-${{ matrix.os }}.revalidated.log" | head -n 1
            )"
            if [[ -z "$live_diagnostic" || -z "$captured_diagnostic" ]]; then
              echo "The loader failure did not produce a validator diagnosis in both runs." >&2
              cat "$console_path" >&2
              cat "$RUNNER_TEMP/expo-startup-${{ matrix.os }}.revalidated.log" >&2
              exit 1
            fi
            live_library="$(
              grep -Eo 'libgtk-3(-0)?\.(dylib|so(\.[0-9]+)?|dll)' <<<"$live_diagnostic" |
                head -n 1
            )"
            captured_library="$(
              grep -Eo 'libgtk-3(-0)?\.(dylib|so(\.[0-9]+)?|dll)' <<<"$captured_diagnostic" |
                head -n 1
            )"
            if [[ -z "$live_library" || "$live_library" != "$captured_library" ]]; then
              echo "The recorded loader output produced a different useful diagnosis." >&2
              printf 'live: %s\ncaptured: %s\n' "$live_diagnostic" "$captured_diagnostic" >&2
              exit 1
            fi
          fi

          {
            echo "## Real platform launcher capture"
            echo "- Runner: \`$(sanitize_workflow_text "${{ matrix.os }}")\`"
            echo "- Captured output: **PASS** (redacted before persistence)"
            if [[ "$loader_failure" -eq 1 ]]; then
              echo "- Launcher result: diagnosed loader failure (matched in both runs)"
            else
              echo "- Launcher result: healthy startup"
            fi
            echo "- Initial validator status: \`$record_status\`"
            echo "- Revalidation status: \`$revalidation_status\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh and verify the versioned loader evidence
        shell: bash
        env:
          REAL_CAPTURE_PATH: ${{ runner.temp }}/expo-startup-${{ matrix.os }}.log
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            macos-latest) capture_platform="macos" ;;
            windows-latest) capture_platform="windows" ;;
            *)
              echo "Unexpected real-platform runner: ${{ matrix.os }}" >&2
              exit 1
              ;;
          esac

          capture_directory="$RUNNER_TEMP/preview-loader-captures"
          refreshed_fixture="$RUNNER_TEMP/preview-startup-runtime-library-fixture.mjs"
          incomplete_directory="$RUNNER_TEMP/preview-loader-captures-incomplete"
          mkdir -p "$capture_directory" "$incomplete_directory"

          # The real launcher log is validated and redacted above. The
          # refresh command consumes one complete JSON artifact per platform;
          # use the checked-in sample inventory as the deterministic baseline
          # for the other cases while recording the runner's installed
          # versions in every artifact. This keeps the hosted check focused
          # on the refresh contract rather than on manufacturing loader
          # wording from a healthy launcher run.
          CAPTURE_DIR="$capture_directory" \
          CAPTURE_PLATFORM="$capture_platform" \
          REAL_CAPTURE_PATH="$REAL_CAPTURE_PATH" \
          node --input-type=module <<'NODE'
          import { createRequire } from "node:module";
          import { readFileSync, writeFileSync, mkdirSync } from "node:fs";
          import { join, resolve } from "node:path";

          import {
            CAPTURED_LOADER_SAMPLES,
            fixtureOutput,
          } from "./artifacts/chat-app/scripts/preview-startup-runtime-library-fixture.mjs";

          const captureDirectory = process.env.CAPTURE_DIR;
          const capturePlatform = process.env.CAPTURE_PLATFORM;
          const realCapturePath = process.env.REAL_CAPTURE_PATH;
          const packageRequire = createRequire(
            resolve("artifacts/chat-app/package.json"),
          );
          const installedPackageVersion = (packageName) =>
            JSON.parse(
              readFileSync(
                packageRequire.resolve(`${packageName}/package.json`),
                "utf8",
              ),
            ).version;
          const tooling = {
            expoCli: installedPackageVersion("@expo/cli"),
            reactNative: installedPackageVersion("react-native"),
          };
          const realCapture = readFileSync(realCapturePath, "utf8");
          if (realCapture.length === 0) {
            throw new Error("The real launcher capture is empty.");
          }

          mkdirSync(captureDirectory, { recursive: true });
          for (const platform of ["linux", "macos", "windows"]) {
            const samples = Object.fromEntries(
              CAPTURED_LOADER_SAMPLES
                .filter((sample) => sample.platform === platform)
                .map((sample) => [sample.fixture, fixtureOutput[sample.fixture]]),
            );
            if (platform === capturePlatform) {
              const firstFixture = Object.keys(samples)[0];
              samples[firstFixture] = `${samples[firstFixture]}${realCapture}`;
            }
            writeFileSync(
              join(captureDirectory, `${platform}.json`),
              JSON.stringify({ platform, ...tooling, samples }, null, 2) + "\n",
              "utf8",
            );
          }
          NODE

          refresh_output="$(
            pnpm --filter @workspace/chat-app run refresh:preview-loader-evidence \
              --capture-dir "$capture_directory" \
              --output "$refreshed_fixture" 2>&1
          )"
          if ! grep -Fq -- "Refreshed" <<<"$refresh_output" ||
            ! grep -Fq -- "linux, macos, windows" <<<"$refresh_output"; then
            echo "The hosted loader evidence refresh did not report all platforms." >&2
            printf '%s\n' "$refresh_output" >&2
            exit 1
          fi

          CAPTURE_PLATFORM="$capture_platform" \
          REFRESHED_FIXTURE="$refreshed_fixture" \
          node --input-type=module <<'NODE'
          import { createRequire } from "node:module";
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";
          import { CAPTURED_LOADER_SAMPLES } from "./artifacts/chat-app/scripts/preview-startup-runtime-library-fixture.mjs";

          const refreshedSource = readFileSync(process.env.REFRESHED_FIXTURE, "utf8");
          if (!refreshedSource.includes("export const CAPTURED_EXPO_TOOLING")) {
            throw new Error("The refreshed fixture is missing tooling metadata.");
          }
          for (const platform of ["linux", "macos", "windows"]) {
            if (!refreshedSource.includes(`"platform": "${platform}"`)) {
              throw new Error(`The refreshed fixture is missing ${platform} samples.`);
            }
          }
          const refreshedTooling = JSON.parse(
            refreshedSource
              .match(/export const CAPTURED_EXPO_TOOLING = Object\.freeze\(([\s\S]*?)\);/)?.[1] ??
              "null",
          );
          const packageRequire = createRequire(
            resolve("artifacts/chat-app/package.json"),
          );
          const installedPackageVersion = (packageName) =>
            JSON.parse(
              readFileSync(
                packageRequire.resolve(`${packageName}/package.json`),
                "utf8",
              ),
            ).version;
          const installedTooling = {
            expoCli: installedPackageVersion("@expo/cli"),
            reactNative: installedPackageVersion("react-native"),
          };
          if (
            refreshedTooling?.expoCli !== installedTooling.expoCli ||
            refreshedTooling?.reactNative !== installedTooling.reactNative
          ) {
            throw new Error("The refreshed tooling metadata does not match installed packages.");
          }
          if (CAPTURED_LOADER_SAMPLES.length < 3) {
            throw new Error("The loader inventory does not contain all platform groups.");
          }
          NODE

          fixture_path="artifacts/chat-app/scripts/preview-startup-runtime-library-fixture.mjs"
          before_digest="$(
            FIXTURE_PATH="$fixture_path" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          process.stdout.write(
            createHash("sha256")
              .update(readFileSync(process.env.FIXTURE_PATH))
              .digest("hex"),
          );
          NODE
          )"
          cp "$capture_directory/linux.json" "$incomplete_directory/linux.json"
          cp "$capture_directory/macos.json" "$incomplete_directory/macos.json"

          set +e
          missing_platform_output="$(
            pnpm --filter @workspace/chat-app run refresh:preview-loader-evidence \
              --capture-dir "$incomplete_directory" 2>&1
          )"
          missing_platform_status=$?
          set -e
          if [[ "$missing_platform_status" -eq 0 ]] ||
            ! grep -Fq -- "Could not read windows capture" <<<"$missing_platform_output"; then
            echo "The incomplete hosted loader capture did not identify the missing Windows platform." >&2
            printf '%s\n' "$missing_platform_output" >&2
            exit 1
          fi
          after_digest="$(
            FIXTURE_PATH="$fixture_path" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          process.stdout.write(
            createHash("sha256")
              .update(readFileSync(process.env.FIXTURE_PATH))
              .digest("hex"),
          );
          NODE
          )"
          if [[ "$before_digest" != "$after_digest" ]]; then
            echo "The failed hosted refresh changed the existing fixture." >&2
            exit 1
          fi

          {
            echo "- Loader evidence refresh: **PASS** (metadata and Linux/macOS/Windows samples generated)"
            echo "- Incomplete capture guard: **PASS** (missing Windows reported; fixture unchanged)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted launcher capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-startup-${{ matrix.os }}
          path: ${{ runner.temp }}/expo-startup-${{ matrix.os }}.log
          if-no-files-found: error
