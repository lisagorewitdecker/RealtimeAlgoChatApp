# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: ESLint

on:
  push:
    branches: [ "production" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "production" ]
  schedule:
    - cron: '24 8 * * 1'

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: |
          tmp_dir="$(mktemp -d)"
          npm install --prefix "$tmp_dir" \
            eslint@8.57.1 \
            @microsoft/eslint-formatter-sarif@3.1.0 \
            @typescript-eslint/parser@8.43.0 \
            typescript@5.9.3
          ESLINT_PACKAGE_ROOT="$tmp_dir/node_modules" "$tmp_dir/node_modules/.bin/eslint" . \
            --config .eslintrc.cjs \
            --ext .js,.jsx,.mjs,.cjs,.ts,.tsx \
            --format "$tmp_dir/node_modules/@microsoft/eslint-formatter-sarif" \
            --output-file eslint-results.sarif

      - name: Upload analysis results to GitHub
        if: ${{ success() && hashFiles('eslint-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
