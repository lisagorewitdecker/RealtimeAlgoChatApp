          )"
          android_section="$(
            awk '
              /^## Android native large-text evidence$/ { collecting=1 }
              collecting { print }
            ' "$summary_path"
          )"

          require_contains "$ios_section" "- Status: **FAIL**"
          require_contains "$ios_section" "- Artifact download: **FAIL**"
          require_contains "$ios_section" "$NATIVE_IOS_RECOVERY_LINE"
          require_not_contains "$ios_section" "https://github.example"

          require_contains "$android_section" "- Status: **FAIL**"
          require_contains "$android_section" "- Artifact download: **FAIL**"
          require_contains "$android_section" "$NATIVE_ANDROID_RECOVERY_LINE"
          require_not_contains "$android_section" "https://github.example"

          cat "$summary_path" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify temporary native evidence artifact outage recovers on retry
        env:
          REVIEWED_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/workflow-output-safety.sh
          recovery_root="$(mktemp -d)"
          pass_summary_path="$(mktemp)"
          failed_retry_summary_path="$(mktemp)"
          attempt_file="$recovery_root/ios-download-attempt"
          recovered_submission_marker="$recovery_root/recovered-submission-command-ran"
          failed_submission_marker="$recovery_root/failed-submission-command-ran"
          trap 'rm -rf "$recovery_root" "$pass_summary_path" "$failed_retry_summary_path"' EXIT
          resolved_commit_sha="$(git rev-parse --verify HEAD)"
          safe_reviewed_ref="$(sanitize_workflow_text "$REVIEWED_REF")"

          {
            echo "## Reviewed release revision"
            printf -- '- Checked ref: `%s`\n' "$safe_reviewed_ref"
            printf -- '- Resolved commit SHA: `%s`\n' "$resolved_commit_sha"
          } >> "$GITHUB_STEP_SUMMARY"

          write_controlled_evidence() {
            local platform="$1"
            local run_dir="$recovery_root/$platform/20260915T120000Z"
            mkdir -p "$run_dir/screenshots" "$run_dir/call-surface"
            printf 'controlled\n' > "$run_dir/candidate-build-id.txt"
            if [[ "$platform" == "ios" ]]; then
              printf 'platform=ios\ncandidate_build_id=controlled\nrecorded_at_utc=2026-09-15T12:00:00Z\ndevice=controlled-device\n' > "$run_dir/runner-metadata.txt"
            else
              printf 'platform=android\ncandidate_build_id=controlled\nrecorded_at_utc=2026-09-15T12:00:00Z\ndevice_serial=controlled\ndevice_model=controlled\nandroid_release=controlled\nandroid_api=36\nscreen_dp=320x568\ndensity_dpi=160\nuser_rotation=0\n' > "$run_dir/runner-metadata.txt"
            fi
            printf 'platform=%s\nrun_mode=release-gate\ncandidate_build_id=controlled\nstatus=PASS\nrecorded_at_utc=2026-09-15T12:00:00Z\n' "$platform" > "$run_dir/pass-fail-record.txt"
            printf 'platform=%s\nreviewer=controlled-reviewer\nreviewed_at_utc=2026-09-15T12:01:00Z\ncandidate_build_id=controlled\ndecision=APPROVED\napproval_scope=candidate\n' "$platform" > "$run_dir/review-record.txt"
            printf '{}\n' > "$run_dir/native-info.json"
            printf '# Native branding validation\n\n- Status: **PASS**\n' > "$run_dir/native-branding-check.md"
            printf '<testsuite tests="1" failures="0"></testsuite>\n' > "$run_dir/maestro-results.xml"
            printf '<testsuite tests="1" failures="0"></testsuite>\n' > "$run_dir/sentry-maestro-results.xml"
            printf 'platform=%s\ncandidate_build_id=controlled\nmarker=controlled\n' "$platform" > "$run_dir/sentry-trigger.txt"
            printf '{"status":"PASS","eventId":"0123456789abcdef0123456789abcdef","platform":"%s","candidateBuildId":"controlled","marker":"controlled","release":"controlled","dist":"1","readableFrame":{"filename":"controlled.tsx","function":"createNativeSourceMapProbeError","line":1,"column":1}}\n' "$platform" > "$run_dir/sentry-source-map-evidence.json"
            for screenshot_index in $(seq 1 11); do
              printf 'controlled screenshot\n' > "$run_dir/screenshots/screen-$screenshot_index.png"
            done
            for call_index in $(seq 1 2); do
              printf 'controlled call surface\n' > "$run_dir/call-surface/call-$call_index.png"
            done
          }

          simulate_store_submission() {
            local marker="$1"
            printf 'submission-reached\n' > "$marker"
          }

          download_ios_once() {
            local attempt=0
            if [[ -s "$attempt_file" ]]; then
              attempt="$(cat "$attempt_file")"
            fi
            attempt=$((attempt + 1))
            printf '%s\n' "$attempt" > "$attempt_file"
            if ((attempt == 1)); then
              echo "Controlled iOS artifact outage injected on the first download attempt." >&2
              return 1
            fi
            write_controlled_evidence ios
          }

          set +e
          download_ios_once
          initial_download_status=$?
          set -e
          if [[ "$initial_download_status" == "0" ]]; then
            echo "The controlled iOS first download unexpectedly succeeded." >&2
            exit 1
          fi
          if [[ -e "$recovery_root/ios" ]]; then
            echo "The failed first download left partial iOS evidence behind." >&2
            exit 1
          fi

          set +e
          download_ios_once
          retry_download_status=$?
          set -e
          if [[ "$retry_download_status" != "0" ]]; then
            echo "The controlled iOS retry did not recover the artifact download." >&2
            exit 1
          fi
          if [[ "$(cat "$attempt_file")" != "2" ]]; then
            echo "The controlled iOS artifact was not attempted exactly once before retry." >&2
            exit 1
          fi

          write_controlled_evidence android

          if \
            GITHUB_STEP_SUMMARY="$pass_summary_path" \
            NATIVE_EVIDENCE_REQUIRE_APPROVAL=1 \
            NATIVE_IOS_EVIDENCE_DOWNLOAD_RESULT=success \
            NATIVE_ANDROID_EVIDENCE_DOWNLOAD_RESULT=success \
            bash scripts/run-untrusted-checker.sh bash scripts/check-native-large-text-evidence.sh "$recovery_root"; then
            simulate_store_submission "$recovered_submission_marker"
          else
            echo "The strict native evidence checker rejected the artifact after a successful retry." >&2
            exit 1
          fi

          if [[ ! -e "$recovered_submission_marker" ]]; then
            echo "The recovered strict evidence check did not reach the simulated submission boundary." >&2
            exit 1
          fi

          if \
            GITHUB_STEP_SUMMARY="$failed_retry_summary_path" \
            NATIVE_EVIDENCE_REQUIRE_APPROVAL=1 \
            NATIVE_IOS_EVIDENCE_DOWNLOAD_RESULT=failure \
            NATIVE_ANDROID_EVIDENCE_DOWNLOAD_RESULT=success \
            bash scripts/run-untrusted-checker.sh bash scripts/check-native-large-text-evidence.sh "$recovery_root"; then
            simulate_store_submission "$failed_submission_marker"
            echo "The native evidence checker passed despite a failed retry." >&2
            exit 1
          fi

          if [[ -e "$failed_submission_marker" ]]; then
            echo "The failed retry reached the simulated store submission boundary." >&2
            exit 1
          fi

          grep -Fq -- "- Status: **PASS**" "$pass_summary_path"
          grep -Fq -- "- Artifact download: **PASS**" "$pass_summary_path"
          grep -Fq -- "- Status: **FAIL**" "$failed_retry_summary_path"
          grep -Fq -- "- Artifact download: **FAIL**" "$failed_retry_summary_path"
          cat "$pass_summary_path" >> "$GITHUB_STEP_SUMMARY"

  native-evidence-tamper-regression:
    name: Native evidence tamper regression
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - mobile-release-node-range
      - mobile-release-credentials
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create controlled native evidence fixture artifacts
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$RUNNER_TEMP/native-evidence-tamper-fixtures"
          run_timestamp=20260915T120000Z

          write_fixture() {
            local platform="$1"
            local run_dir="$fixture_root/$platform/$run_timestamp"
            mkdir -p "$run_dir/screenshots" "$run_dir/call-surface"
            printf 'controlled\n' > "$run_dir/candidate-build-id.txt"
            if [[ "$platform" == "ios" ]]; then
              printf 'platform=ios\nrun_mode=release-gate\ncandidate_build_id=controlled\napp_id=com.example.chat\ndevice=controlled-device\ndevice_udid=controlled\nrecorded_at_utc=2026-09-15T12:00:00Z\n' > "$run_dir/runner-metadata.txt"
              printf '# iOS native readiness\n\n- Status: **READY**\n' > "$run_dir/ios-readiness.md"
            else
              printf 'platform=android\nrun_mode=release-gate\ncandidate_build_id=controlled\napp_id=com.example.chat\ndevice_serial=controlled\ndevice_model=controlled\nandroid_release=controlled\nandroid_api=36\nscreen_px=320x568\nscreen_dp=320x568\ndensity_dpi=160\nuser_rotation=0\nrecorded_at_utc=2026-09-15T12:00:00Z\n' > "$run_dir/runner-metadata.txt"
              printf 'applicationLabel=Chat\npermissions=android.permission.INTERNET\n' > "$run_dir/android-badging.txt"
            fi
            printf 'platform=%s\nrun_mode=release-gate\ncandidate_build_id=controlled\nstatus=PASS\nnative_screenshot_count=11\ncall_surface_screenshot_count=2\nrecorded_at_utc=2026-09-15T12:30:00Z\n' "$platform" > "$run_dir/pass-fail-record.txt"
            printf '{}\n' > "$run_dir/native-info.json"
            printf '# Native branding validation\n\n- Status: **PASS**\n' > "$run_dir/native-branding-check.md"
            printf '<testsuite tests="1" failures="0"></testsuite>\n' > "$run_dir/maestro-results.xml"
            printf '<testsuite tests="1" failures="0"></testsuite>\n' > "$run_dir/sentry-maestro-results.xml"
            printf 'platform=%s\ncandidate_build_id=controlled\nmarker=controlled\n' "$platform" > "$run_dir/sentry-trigger.txt"
            printf '{"status":"PASS","eventId":"0123456789abcdef0123456789abcdef","platform":"%s","candidateBuildId":"controlled","marker":"controlled","release":"controlled","dist":"1","readableFrame":{"filename":"controlled.tsx","function":"createNativeSourceMapProbeError","line":1,"column":1}}\n' "$platform" > "$run_dir/sentry-source-map-evidence.json"
            for screenshot_index in $(seq 1 11); do
              printf 'controlled screenshot\n' > "$run_dir/screenshots/screen-$screenshot_index.png"
            done
            for call_index in $(seq 1 2); do
              printf 'controlled call surface\n' > "$run_dir/call-surface/call-$call_index.png"
            done
            printf 'platform=%s\nreviewer=controlled-reviewer\nreviewed_at_utc=2026-09-15T12:31:00Z\ncandidate_build_id=controlled\ndecision=APPROVED\nnotes=Controlled fixture approval.\n' "$platform" > "$run_dir/review-record.txt"
          }

          rm -rf "$fixture_root"
          write_fixture ios
          write_fixture android

      - name: Upload controlled iOS evidence fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-evidence-tamper-fixture-ios
          path: ${{ runner.temp }}/native-evidence-tamper-fixtures/ios
          if-no-files-found: error

      - name: Upload controlled Android evidence fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-evidence-tamper-fixture-android
          path: ${{ runner.temp }}/native-evidence-tamper-fixtures/android
          if-no-files-found: error

      - name: Download controlled iOS evidence fixture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-evidence-tamper-fixture-ios
          path: ${{ runner.temp }}/native-evidence-tamper-downloads/ios

      - name: Download controlled Android evidence fixture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-evidence-tamper-fixture-android
          path: ${{ runner.temp }}/native-evidence-tamper-downloads/android

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}

      - name: Run strict tamper block check against downloaded fixtures
        id: tamper-check
        env:
          NATIVE_EVIDENCE_TAMPER_FIXTURES_ROOT: ${{ runner.temp }}/native-evidence-tamper-downloads
        run: bash scripts/run-untrusted-checker.sh pnpm run test:native-large-text-evidence

      - name: Summarize native evidence tamper regression
        if: ${{ always() }}
        env:
          TAMPER_RESULT: ${{ steps.tamper-check.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Hosted native evidence tamper regression"
            echo
            if [[ "$TAMPER_RESULT" == "success" ]]; then
              echo "- Status: **PASS**"
              echo "- Altered iOS fixture: **BLOCKED**; submission stub: **NOT INVOKED**"
              echo "- Altered Android fixture: **BLOCKED**; submission stub: **NOT INVOKED**"
            else
              echo "- Status: **BLOCKED**"
              echo "- Result: downloaded-fixture tamper validation failed; store submission is blocked."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  native-ios:
    name: Native large-text smoke (iOS)
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      actions: write
      contents: read
    needs:
      - mobile-release-node-range
      - mobile-release-credentials
    outputs:
      native_evidence_artifact_url: ${{ steps.upload-ios-native-smoke.outputs.artifact-url }}
      native_evidence_digest_manifest: ${{ steps.ios-native-evidence-digest.outputs.native_evidence_digest_manifest }}
    runs-on:
      - self-hosted
      - macos
      - ios
      - smallest-simulator
    timeout-minutes: 90
    environment:
      name: mobile-release
    env:
      NATIVE_SMOKE_RESULTS_DIR: ${{ github.workspace }}/test-results/native-large-text/ios/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Clear prior iOS evidence from this runner
        if: ${{ always() }}
        run: rm -rf test-results/native-large-text/ios

      - name: Check iOS release prerequisites
        env:
          NATIVE_SMOKE_IOS_APP_ID: ${{ secrets.NATIVE_SMOKE_IOS_APP_ID }}
          NATIVE_SMOKE_EMAIL: ${{ secrets.NATIVE_SMOKE_EMAIL }}
          NATIVE_SMOKE_PASSWORD: ${{ secrets.NATIVE_SMOKE_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NATIVE_SMOKE_IOS_SENTRY_RELEASE: ${{ secrets.NATIVE_SMOKE_IOS_SENTRY_RELEASE }}
          NATIVE_SMOKE_IOS_SENTRY_DIST: ${{ secrets.NATIVE_SMOKE_IOS_SENTRY_DIST }}
          NATIVE_SMOKE_IOS_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
        run: bash scripts/run-untrusted-checker.sh bash scripts/check-ios-release-prerequisites.sh

      - name: Set up pnpm
        id: setup-pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        id: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify app branding
        id: app-branding
        run: bash scripts/run-untrusted-checker.sh pnpm --filter @workspace/chat-app run validate:branding

      - name: Verify iOS release configuration
        id: ios-release-configuration
        env:
          NATIVE_SMOKE_IOS_APP_ID: ${{ secrets.NATIVE_SMOKE_IOS_APP_ID }}
          NATIVE_SMOKE_IOS_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          NATIVE_SMOKE_EMAIL: ${{ secrets.NATIVE_SMOKE_EMAIL }}
          NATIVE_SMOKE_PASSWORD: ${{ secrets.NATIVE_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          for value in \
            NATIVE_SMOKE_IOS_APP_ID \
            NATIVE_SMOKE_IOS_BUILD_ID \
            NATIVE_SMOKE_EMAIL \
            NATIVE_SMOKE_PASSWORD; do
            if [[ -z "${!value:-}" ]]; then
              echo "Required iOS release configuration is incomplete." >&2
              exit 2
            fi
          done

      - name: Verify iOS simulator tooling
        id: ios-xcrun
        run: |
          set -euo pipefail
          if ! command -v xcrun >/dev/null 2>&1; then
            echo "xcrun is required on the prepared iOS runner." >&2
            exit 2
          fi

      - name: Verify prepared iPhone SE simulator
        id: ios-simulator
        run: |
          set -euo pipefail
          source scripts/workflow-output-safety.sh
          booted_devices="$(xcrun simctl list devices booted)"
          device_udid="$(
            sed -n 's/^[[:space:]]*iPhone SE (3rd generation) (\([0-9A-F-]\{8,\}\)) (Booted)[[:space:]]*$/\1/p' <<<"$booted_devices" |
              head -n 1
          )"
          if [[ -z "$device_udid" ]]; then
            echo "A booted iPhone SE (3rd generation) is required on the iOS runner." >&2
            xcrun simctl list devices booted 2>&1 | sanitize_workflow_stream >&2 || true
            exit 2
          fi
          printf 'NATIVE_SMOKE_IOS_DEVICE_UDID=%s\n' "$device_udid" >> "$GITHUB_ENV"
          echo "Prepared iPhone SE (3rd generation): $(sanitize_workflow_text "$device_udid")"

      - name: Inspect installed iOS native branding
        id: ios-native-branding
        env:
          NATIVE_SMOKE_APP_ID: ${{ secrets.NATIVE_SMOKE_IOS_APP_ID }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          NATIVE_SMOKE_IOS_DEVICE_UDID: ${{ env.NATIVE_SMOKE_IOS_DEVICE_UDID }}
        run: |
          set -euo pipefail
          mkdir -p "$NATIVE_SMOKE_RESULTS_DIR"
          device_udid="${NATIVE_SMOKE_IOS_DEVICE_UDID:-}"
          if [[ -z "$device_udid" ]]; then
            echo "The prepared iPhone SE simulator UDID was not carried forward from verification." >&2
            exit 2
          fi
          app_container="$(xcrun simctl get_app_container "$device_udid" "$NATIVE_SMOKE_APP_ID" app)"
          if [[ ! -f "$app_container/Info.plist" ]]; then
            echo "The release candidate is not installed on the prepared iOS simulator." >&2
            exit 2
          fi
          if ! LC_ALL=C grep -aR -Fq "SENTRY_RELEASE_PREFLIGHT_PASSED_V1" "$app_container"; then
            echo "The installed iOS candidate does not contain crash-reporting preflight evidence. Rebuild it with SENTRY_DSN or EXPO_PUBLIC_SENTRY_DSN configured." >&2
            exit 2
          fi
          echo "Verified crash-reporting preflight evidence in the installed iOS candidate."
          metadata_path="$NATIVE_SMOKE_RESULTS_DIR/native-info.json"
          plutil -convert json -o "$metadata_path" "$app_container/Info.plist"
          bash scripts/run-untrusted-checker.sh pnpm --filter @workspace/chat-app run validate:branding:native -- \
            --platform ios \
            --metadata "$metadata_path" \
            --build-id "$NATIVE_SMOKE_BUILD_ID" \
            --results-dir "$NATIVE_SMOKE_RESULTS_DIR"

      - name: Verify Maestro
        id: ios-maestro
        run: maestro --version

      - name: Run iOS native large-text release gate
        id: ios-native-evidence
        env:
          NATIVE_SMOKE_APP_ID: ${{ secrets.NATIVE_SMOKE_IOS_APP_ID }}
          NATIVE_SMOKE_EMAIL: ${{ secrets.NATIVE_SMOKE_EMAIL }}
          NATIVE_SMOKE_PASSWORD: ${{ secrets.NATIVE_SMOKE_PASSWORD }}
          NATIVE_SMOKE_DISPLAY_NAME: ${{ secrets.NATIVE_SMOKE_DISPLAY_NAME }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          NATIVE_SMOKE_IOS_DEVICE_UDID: ${{ env.NATIVE_SMOKE_IOS_DEVICE_UDID }}
          NATIVE_SMOKE_SUMMARY_DEFER: "1"
        run: bash scripts/run-untrusted-checker.sh pnpm --filter @workspace/chat-app test:native-large-text ios

      - name: Send controlled iOS JavaScript error
        id: ios-sentry-trigger
        env:
          NATIVE_SMOKE_APP_ID: ${{ secrets.NATIVE_SMOKE_IOS_APP_ID }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          NATIVE_SMOKE_IOS_DEVICE_UDID: ${{ env.NATIVE_SMOKE_IOS_DEVICE_UDID }}
          NATIVE_SENTRY_MARKER: native-${{ github.run_id }}-${{ github.run_attempt }}-ios
        run: bash scripts/run-untrusted-checker.sh pnpm --filter @workspace/chat-app test:native-sentry ios

      - name: Verify readable iOS source maps in Sentry
        id: ios-sentry-verification
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_EXPECTED_PLATFORM: ios
          SENTRY_EXPECTED_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          SENTRY_EXPECTED_RELEASE: ${{ secrets.NATIVE_SMOKE_IOS_SENTRY_RELEASE }}
          SENTRY_EXPECTED_DIST: ${{ secrets.NATIVE_SMOKE_IOS_SENTRY_DIST }}
          SENTRY_PROBE_MARKER: native-${{ github.run_id }}-${{ github.run_attempt }}-ios
          SENTRY_EVIDENCE_PATH: ${{ env.NATIVE_SMOKE_RESULTS_DIR }}/sentry-source-map-evidence.json
        run: bash scripts/run-untrusted-checker.sh node scripts/verify-sentry-native-event.mjs

      - name: Summarize iOS readiness
        if: always()
        env:
          IOS_RESULTS_DIR: ${{ env.NATIVE_SMOKE_RESULTS_DIR }}
          WORKSPACE_RESULT: ${{ steps.install-dependencies.outcome }}
          APP_BRANDING_RESULT: ${{ steps.app-branding.outcome }}
          IOS_RELEASE_CONFIGURATION_RESULT: ${{ steps.ios-release-configuration.outcome }}
          IOS_XCRUN_RESULT: ${{ steps.ios-xcrun.outcome }}
          IOS_SIMULATOR_RESULT: ${{ steps.ios-simulator.outcome }}
          IOS_NATIVE_BRANDING_RESULT: ${{ steps.ios-native-branding.outcome }}
          IOS_MAESTRO_RESULT: ${{ steps.ios-maestro.outcome }}
          IOS_NATIVE_EVIDENCE_RESULT: ${{ steps.ios-native-evidence.outcome }}
          IOS_SENTRY_TRIGGER_RESULT: ${{ steps.ios-sentry-trigger.outcome }}
          IOS_SENTRY_VERIFICATION_RESULT: ${{ steps.ios-sentry-verification.outcome }}
        run: |
          set -euo pipefail
          source scripts/workflow-output-safety.sh
          status="READY"
          blockers=()
          checks=()

          add_check() {
            local label="$1"
            local result="$2"
            if [[ "$result" == "success" ]]; then
              checks+=("- ${label}: **READY**")
            else
              status="BLOCKED"
              checks+=("- ${label}: **BLOCKED**")
              blockers+=("${label}")
            fi
          }

          add_check "Workspace dependencies" "$WORKSPACE_RESULT"
          add_check "App branding source" "$APP_BRANDING_RESULT"
          add_check "Release configuration" "$IOS_RELEASE_CONFIGURATION_RESULT"
          add_check "Xcode simulator tooling" "$IOS_XCRUN_RESULT"
          add_check "Booted iPhone SE (3rd generation)" "$IOS_SIMULATOR_RESULT"
          add_check "Installed native candidate" "$IOS_NATIVE_BRANDING_RESULT"
          add_check "Maestro" "$IOS_MAESTRO_RESULT"
          add_check "Native large-text evidence" "$IOS_NATIVE_EVIDENCE_RESULT"
          add_check "Controlled Sentry error" "$IOS_SENTRY_TRIGGER_RESULT"
          add_check "Readable Sentry source maps" "$IOS_SENTRY_VERIFICATION_RESULT"

          {
            echo "## iOS native large-text readiness"
            echo
            echo "- Status: **${status}**"
            echo
            echo "### Prerequisites"
            printf '%s\n' "${checks[@]}"
            if [[ -f "$IOS_RESULTS_DIR/ios-readiness.md" ]]; then
              diagnostics="$(
                awk '
                  /^### Blocking prerequisites$/ { collecting=1; next }
                  collecting && /^- / { print; next }
                  collecting && !/^- / { exit }
                ' "$IOS_RESULTS_DIR/ios-readiness.md"
              )"
              if [[ -n "$diagnostics" ]]; then
                echo
                echo "### Readiness diagnostics"
                printf '%s\n' "$diagnostics" | sanitize_workflow_stream
              fi
            fi
            if ((${#blockers[@]})); then
              echo
              echo "### Blocking prerequisites"
              printf -- '- %s\n' "${blockers[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create trusted iOS native evidence digest manifest
        id: ios-native-evidence-digest
        run: |
          set -euo pipefail
          manifest="$(
            cd "$NATIVE_SMOKE_RESULTS_DIR"
            find . -type f ! -name review-record.txt -print |
              LC_ALL=C sort |
              while IFS= read -r relative_path; do
                if command -v sha256sum >/dev/null 2>&1; then
                  digest="$(sha256sum "$relative_path" | awk '{ print $1 }')"
                else
                  digest="$(shasum -a 256 "$relative_path" | awk '{ print $1 }')"
                fi
                printf '%s  %s\n' "$digest" "${relative_path#./}"
              done
          )"
          {
            echo 'native_evidence_digest_manifest<<NATIVE_EVIDENCE_DIGEST_MANIFEST'
            printf '%s\n' "$manifest"
            echo NATIVE_EVIDENCE_DIGEST_MANIFEST
          } >> "$GITHUB_OUTPUT"

      - name: Upload iOS native smoke artifacts
        if: always()
        id: upload-ios-native-smoke
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-large-text-ios
          path: test-results/native-large-text/ios/**
          if-no-files-found: warn
          # Native report links are used for historical release review. Keep
          # the fixed artifact through GitHub's maximum supported retention
          # window; the release gate still downloads it before publishing a
          # link so expired artifacts cannot be presented as available.
          retention-days: 90
          overwrite: true

      - name: Summarize iOS native branding
        if: always()
        env:
          NATIVE_BRANDING_ARTIFACT_URL: ${{ steps.upload-ios-native-smoke.outputs.artifact-url }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
        run: scripts/summarize-native-branding.sh ios

  android-prerequisite-preflight:
    name: Android release runner preflight
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - mobile-release-node-range
      - mobile-release-credentials
    runs-on:
      - self-hosted
      - linux
      - android
      - smallest-simulator
    timeout-minutes: 20
    environment:
      name: mobile-release
    steps:
      - name: Check out release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check Android release prerequisites
        env:
          NATIVE_SMOKE_APP_ID: ${{ secrets.NATIVE_SMOKE_ANDROID_APP_ID }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
          NATIVE_SMOKE_EMAIL: ${{ secrets.NATIVE_SMOKE_EMAIL }}
          NATIVE_SMOKE_PASSWORD: ${{ secrets.NATIVE_SMOKE_PASSWORD }}
          NATIVE_SMOKE_DISPLAY_NAME: ${{ secrets.NATIVE_SMOKE_DISPLAY_NAME }}
        run: bash scripts/run-untrusted-checker.sh bash scripts/check-android-release-prerequisites.sh

  native-android:
    name: Native large-text smoke (Android)
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      actions: write
      contents: read
    outputs:
      native_evidence_artifact_url: ${{ steps.upload-android-native-smoke.outputs.artifact-url }}
      native_evidence_digest_manifest: ${{ steps.android-native-evidence-digest.outputs.native_evidence_digest_manifest }}
    needs:
      - mobile-release-node-range
      - mobile-release-credentials
      - android-prerequisite-preflight
    runs-on:
      - self-hosted
      - linux
      - android
      - smallest-simulator
    timeout-minutes: 90
    environment:
      name: mobile-release
    env:
      NATIVE_SMOKE_RESULTS_DIR: ${{ github.workspace }}/test-results/native-large-text/android/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Clear prior Android evidence from this runner
        run: rm -rf test-results/native-large-text/android

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify app branding
        run: bash scripts/run-untrusted-checker.sh pnpm --filter @workspace/chat-app run validate:branding

      - name: Verify prepared smallest Android emulator
        run: |
          set -euo pipefail
          if ! command -v adb >/dev/null 2>&1; then
            echo "adb is required on the prepared Android runner." >&2
            exit 2
          fi
          timeout 60s adb wait-for-device
          adb get-state >/dev/null
          size="$(adb shell wm size | tr -d '\r' | tail -n 1 | sed 's/^.*: //')"
          density="$(adb shell wm density | tr -d '\r' | tail -n 1 | sed 's/^.*: //')"
          IFS=x read -r width_px height_px <<<"$size"
          if [[ ! "$width_px" =~ ^[0-9]+$ || ! "$height_px" =~ ^[0-9]+$ || ! "$density" =~ ^[0-9]+$ ]]; then
            echo "Could not determine Android emulator size and density." >&2
            exit 2
          fi
          width_dp=$((width_px * 160 / density))
          height_dp=$((height_px * 160 / density))
          if ((width_dp > 320 || height_dp > 568)); then
            echo "The Android runner must use an emulator at or below 320x568 dp; found ${width_dp}x${height_dp} dp." >&2
            exit 2
          fi
          rotation="$(adb shell settings get system user_rotation | tr -d '\r' | tr -d '[:space:]')"
          if [[ "$rotation" != "0" && "$rotation" != "2" ]]; then
            echo "The Android runner must be in portrait orientation; found user_rotation=${rotation:-unknown}." >&2
            exit 2
          fi

      - name: Inspect installed Android native branding
        id: android-native-branding
        env:
          NATIVE_SMOKE_APP_ID: ${{ secrets.NATIVE_SMOKE_ANDROID_APP_ID }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$NATIVE_SMOKE_RESULTS_DIR"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          aapt2_path="$(command -v aapt2 || true)"
          if [[ -z "$aapt2_path" && -n "$sdk_root" && -d "$sdk_root/build-tools" ]]; then
            aapt2_path="$(
              find "$sdk_root/build-tools" -type f -name aapt2 -perm -111 |
                sort -V |
                tail -n 1
            )"
          fi
          if [[ -z "$aapt2_path" || ! -x "$aapt2_path" ]]; then
            echo "aapt2 is required to inspect the compiled Android manifest." >&2
            exit 2
          fi
          apk_source="$(adb shell pm path "$NATIVE_SMOKE_APP_ID" | tr -d '\r' | sed -n 's/^package://p' | head -n 1)"
          if [[ -z "$apk_source" ]]; then
            echo "Could not locate the release candidate APK on the prepared Android device." >&2
            exit 2
          fi
          apk_path="$RUNNER_TEMP/realtime-algo-chat-app.apk"
          adb pull "$apk_source" "$apk_path"
          apk_extract_dir="$RUNNER_TEMP/realtime-algo-chat-app-extracted"
          rm -rf "$apk_extract_dir"
          unzip -q "$apk_path" -d "$apk_extract_dir"
          if ! LC_ALL=C grep -aR -Fq "SENTRY_RELEASE_PREFLIGHT_PASSED_V1" "$apk_extract_dir"; then
            echo "The installed Android candidate does not contain crash-reporting preflight evidence. Rebuild it with SENTRY_DSN or EXPO_PUBLIC_SENTRY_DSN configured." >&2
            exit 2
          fi
          echo "Verified crash-reporting preflight evidence in the installed Android candidate."
          badging_path="$NATIVE_SMOKE_RESULTS_DIR/android-badging.txt"
          "$aapt2_path" dump badging "$apk_path" > "$badging_path"
          metadata_path="$NATIVE_SMOKE_RESULTS_DIR/native-info.json"
          node --input-type=module - "$badging_path" "$metadata_path" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const [, , badgingPath, metadataPath] = process.argv;
          const badging = readFileSync(badgingPath, "utf8");
          const label = badging.match(/^application-label:'([^']*)'$/m)?.[1];
          const permissions = [...badging.matchAll(
            /^uses-permission: name='([^']+)'/gm,
          )].map((match) => match[1]);
          // A label aapt2 did not report is left out so the branding validator
          // fails on the missing field and its summary names it, instead of
          // this step failing before any report exists.
          const metadata =
            label === undefined ? { permissions } : { applicationLabel: label, permissions };
          writeFileSync(metadataPath, `${JSON.stringify(metadata, null, 2)}\n`);
          NODE
          bash scripts/run-untrusted-checker.sh pnpm --filter @workspace/chat-app run validate:branding:native -- \
            --platform android \
            --metadata "$metadata_path" \
            --build-id "$NATIVE_SMOKE_BUILD_ID" \
            --results-dir "$NATIVE_SMOKE_RESULTS_DIR"

      - name: Verify Maestro
        run: maestro --version

      - name: Run Android native large-text release gate
        id: android-native-evidence
        env:
          NATIVE_SMOKE_APP_ID: ${{ secrets.NATIVE_SMOKE_ANDROID_APP_ID }}
          NATIVE_SMOKE_EMAIL: ${{ secrets.NATIVE_SMOKE_EMAIL }}
          NATIVE_SMOKE_PASSWORD: ${{ secrets.NATIVE_SMOKE_PASSWORD }}
          NATIVE_SMOKE_DISPLAY_NAME: ${{ secrets.NATIVE_SMOKE_DISPLAY_NAME }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
        run: bash scripts/run-untrusted-checker.sh pnpm --filter @workspace/chat-app test:native-large-text android

      - name: Send controlled Android JavaScript error
        id: android-sentry-trigger
        env:
          NATIVE_SMOKE_APP_ID: ${{ secrets.NATIVE_SMOKE_ANDROID_APP_ID }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
          NATIVE_SENTRY_MARKER: native-${{ github.run_id }}-${{ github.run_attempt }}-android
        run: bash scripts/run-untrusted-checker.sh pnpm --filter @workspace/chat-app test:native-sentry android

      - name: Verify readable Android source maps in Sentry
        id: android-sentry-verification
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_EXPECTED_PLATFORM: android
          SENTRY_EXPECTED_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
          SENTRY_EXPECTED_RELEASE: ${{ secrets.NATIVE_SMOKE_ANDROID_SENTRY_RELEASE }}
          SENTRY_EXPECTED_DIST: ${{ secrets.NATIVE_SMOKE_ANDROID_SENTRY_DIST }}
          SENTRY_PROBE_MARKER: native-${{ github.run_id }}-${{ github.run_attempt }}-android
          SENTRY_EVIDENCE_PATH: ${{ env.NATIVE_SMOKE_RESULTS_DIR }}/sentry-source-map-evidence.json
        run: bash scripts/run-untrusted-checker.sh node scripts/verify-sentry-native-event.mjs

      - name: Create trusted Android native evidence digest manifest
        id: android-native-evidence-digest
        run: |
          set -euo pipefail
          manifest="$(
            cd "$NATIVE_SMOKE_RESULTS_DIR"
            find . -type f ! -name review-record.txt -print |
              LC_ALL=C sort |
              while IFS= read -r relative_path; do
                if command -v sha256sum >/dev/null 2>&1; then
                  digest="$(sha256sum "$relative_path" | awk '{ print $1 }')"
                else
                  digest="$(shasum -a 256 "$relative_path" | awk '{ print $1 }')"
                fi
                printf '%s  %s\n' "$digest" "${relative_path#./}"
              done
          )"
          {
            echo 'native_evidence_digest_manifest<<NATIVE_EVIDENCE_DIGEST_MANIFEST'
            printf '%s\n' "$manifest"
            echo NATIVE_EVIDENCE_DIGEST_MANIFEST
          } >> "$GITHUB_OUTPUT"

      - name: Upload Android native smoke artifacts
        if: always()
        id: upload-android-native-smoke
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-large-text-android
          path: test-results/native-large-text/android/**
          if-no-files-found: warn
          # Keep the fixed native report link through the full historical
          # review window. The release gate verifies availability before
          # carrying the link into its summary.
          retention-days: 90
          overwrite: true

      - name: Summarize Android native branding
        if: always()
        env:
          NATIVE_BRANDING_ARTIFACT_URL: ${{ steps.upload-android-native-smoke.outputs.artifact-url }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
        run: scripts/summarize-native-branding.sh android

  idle-profile-registration:
    name: Idle profile registration
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      actions: write
      contents: read
    needs:
      - mobile-release-node-range
      - mobile-release-credentials
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: mobile-release
    steps:
      - name: Check out release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine idle-profile secret configuration
        id: idle-profile-config
        env:
          E2E_CHAT_URL: ${{ secrets.E2E_CHAT_URL }}
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -n "${E2E_CHAT_URL:-}" && -n "${E2E_API_URL:-}" ]]; then
            echo "browser_targets_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser_targets_configured=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${E2E_CHAT_URL:-}" && -n "${E2E_API_URL:-}" && -n "${CLERK_PUBLISHABLE_KEY:-}" && -n "${CLERK_SECRET_KEY:-}" && -n "${DATABASE_URL:-}" ]]; then
            echo "release_check_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_check_configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify idle-profile Chat App target
        id: idle-profile-chat-preflight
        if: ${{ steps.idle-profile-config.outputs.browser_targets_configured == 'true' }}
        env:
          E2E_CHAT_URL: ${{ secrets.E2E_CHAT_URL }}
        run: |
          set -euo pipefail
          if ! curl \
            --fail \
            --silent \
            --connect-timeout 5 \
            --max-time 10 \
            --output /dev/null \
            "$E2E_CHAT_URL"; then
            echo "Chat App target is unavailable or unhealthy." >&2
            exit 2
          fi
          echo "Chat App target is ready."

      - name: Verify idle-profile API target
        id: idle-profile-api-preflight
        if: ${{ steps.idle-profile-config.outputs.browser_targets_configured == 'true' }}
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
        run: |
          set -euo pipefail
          # Release checks need database-backed readiness. Deployment health
          # and the Sentry uptime monitor intentionally use /api/livez.
          if ! curl \
            --fail \
            --silent \
            --connect-timeout 5 \
            --max-time 10 \
            --output /dev/null \
            "${E2E_API_URL%/}/api/healthz"; then
            echo "API target is unavailable or unhealthy." >&2
            exit 2
          fi
          echo "API target is ready."

      - name: Record idle-profile browser target preflight
        id: idle-profile-preflight
        if: ${{ always() && steps.idle-profile-config.outputs.browser_targets_configured == 'true' }}
        env:
          IDLE_PROFILE_CHAT_PREFLIGHT_RESULT: ${{ steps.idle-profile-chat-preflight.outcome }}
          IDLE_PROFILE_API_PREFLIGHT_RESULT: ${{ steps.idle-profile-api-preflight.outcome }}
        run: |
          set -euo pipefail
          if [[ "$IDLE_PROFILE_CHAT_PREFLIGHT_RESULT" != "success" ]]; then
            echo "failure_reason=chat-app-target-unavailable" >> "$GITHUB_OUTPUT"
          elif [[ "$IDLE_PROFILE_API_PREFLIGHT_RESULT" != "success" ]]; then
            echo "failure_reason=api-target-unavailable" >> "$GITHUB_OUTPUT"
          else
            echo "failure_reason=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run idle-profile registration release check
        id: idle-profile-check
        if: ${{ steps.idle-profile-config.outputs.release_check_configured == 'true' }}
        env:
          E2E_CHAT_URL: ${{ secrets.E2E_CHAT_URL }}
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          for value in \
            E2E_CHAT_URL \
            E2E_API_URL \
            CLERK_PUBLISHABLE_KEY \
            CLERK_SECRET_KEY \
            DATABASE_URL; do
            if [[ -z "${!value:-}" ]]; then
              echo "Required idle-profile release configuration is incomplete." >&2
              exit 2
            fi
          done
          bash scripts/run-untrusted-checker.sh pnpm --filter @workspace/api-server run test:e2e:idle-profile-registration

      - name: Upload idle-profile browser failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: idle-profile-registration-browser-evidence
          path: artifacts/api-server/test-results/**
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Summarize idle-profile registration check
        if: ${{ always() }}
        env:
          IDLE_PROFILE_PREFLIGHT_FAILURE_REASON: ${{ steps.idle-profile-preflight.outputs.failure_reason }}
          IDLE_PROFILE_RESULT: ${{ steps.idle-profile-check.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Idle profile registration"
            echo
            if [[ "$IDLE_PROFILE_RESULT" == "success" ]]; then
              echo "- Status: **PASS**"
              echo "- Result: the idle client did not repeat \`PUT /api/profile\` after token refresh."
            elif [[ -n "$IDLE_PROFILE_PREFLIGHT_FAILURE_REASON" ]]; then
              echo "- Status: **FAIL**"
              case "$IDLE_PROFILE_PREFLIGHT_FAILURE_REASON" in
                chat-app-target-unavailable)
                  echo "- Result: release is blocked because the Chat App target is unavailable or unhealthy."
                  ;;
                api-target-unavailable)
                  echo "- Result: release is blocked because the API target is unavailable or unhealthy."
                  ;;
                *)
                  echo "- Result: release is blocked because idle-profile browser target preflight failed."
                  ;;
              esac
            elif [[ "$IDLE_PROFILE_RESULT" == "skipped" ]]; then
              echo "- Status: **SKIP**"
              echo "- Result: check was skipped because idle-profile secrets are not configured."
            else
              echo "- Status: **FAIL**"
              echo "- Result: release is blocked because the idle-profile registration check did not pass."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  mobile-release-gate:
    name: Mobile release gate
    if: ${{ github.event_name != 'pull_request' && needs.mobile-release-node-range.result == 'success' && needs.mobile-release-credentials.result == 'success' && needs.native-ios.result == 'success' && needs.native-android.result == 'success' && needs.idle-profile-registration.result == 'success' && needs.native-evidence-summary-regression.result == 'success' && needs.native-evidence-tamper-regression.result == 'success' }}
    outputs:
      ios_native_evidence_artifact_url: ${{ needs.native-ios.outputs.native_evidence_artifact_url }}
      android_native_evidence_artifact_url: ${{ needs.native-android.outputs.native_evidence_artifact_url }}
      ios_native_evidence_digest_manifest: ${{ needs.native-ios.outputs.native_evidence_digest_manifest }}
      android_native_evidence_digest_manifest: ${{ needs.native-android.outputs.native_evidence_digest_manifest }}
    needs:
      - mobile-release-node-range
      - mobile-release-credentials
      - native-ios
      - native-android
      - idle-profile-registration
      - native-evidence-summary-regression
      - native-evidence-tamper-regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download iOS native smoke artifacts
        if: ${{ always() }}
        continue-on-error: true
        id: download-ios-native-smoke
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-large-text-ios
          path: test-results/native-large-text/ios

      - name: Clear partial iOS native smoke artifacts before retry
        if: ${{ always() && steps.download-ios-native-smoke.outcome != 'success' }}
        continue-on-error: true
        id: cleanup-ios-native-smoke
        run: rm -rf -- test-results/native-large-text/ios && mkdir -p -- test-results/native-large-text/ios

      - name: Retry iOS native smoke artifact download
        if: ${{ always() && steps.download-ios-native-smoke.outcome != 'success' && steps.cleanup-ios-native-smoke.outcome == 'success' }}
        continue-on-error: true
        id: retry-ios-native-smoke
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-large-text-ios
          path: test-results/native-large-text/ios

      - name: Download Android native smoke artifacts
        if: ${{ always() }}
        continue-on-error: true
        id: download-android-native-smoke
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-large-text-android
          path: test-results/native-large-text/android

      - name: Clear partial Android native smoke artifacts before retry
        if: ${{ always() && steps.download-android-native-smoke.outcome != 'success' }}
        continue-on-error: true
        id: cleanup-android-native-smoke
        run: rm -rf -- test-results/native-large-text/android && mkdir -p -- test-results/native-large-text/android

      - name: Retry Android native smoke artifact download
        if: ${{ always() && steps.download-android-native-smoke.outcome != 'success' && steps.cleanup-android-native-smoke.outcome == 'success' }}
        continue-on-error: true
        id: retry-android-native-smoke
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-large-text-android
          path: test-results/native-large-text/android

      - name: Validate native evidence completeness
        id: evidence-completeness
        if: ${{ always() }}
        continue-on-error: true
        env:
          REVIEWED_REF: ${{ github.ref }}
          NATIVE_IOS_EVIDENCE_ARTIFACT_URL: ${{ needs.native-ios.outputs.native_evidence_artifact_url }}
          NATIVE_ANDROID_EVIDENCE_ARTIFACT_URL: ${{ needs.native-android.outputs.native_evidence_artifact_url }}
          NATIVE_IOS_EVIDENCE_DIGEST_MANIFEST: ${{ needs.native-ios.outputs.native_evidence_digest_manifest }}
          NATIVE_ANDROID_EVIDENCE_DIGEST_MANIFEST: ${{ needs.native-android.outputs.native_evidence_digest_manifest }}
          NATIVE_IOS_EVIDENCE_DOWNLOAD_RESULT: ${{ steps.download-ios-native-smoke.outcome == 'success' && 'success' || steps.retry-ios-native-smoke.outcome }}
          NATIVE_ANDROID_EVIDENCE_DOWNLOAD_RESULT: ${{ steps.download-android-native-smoke.outcome == 'success' && 'success' || steps.retry-android-native-smoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/workflow-output-safety.sh
          resolved_commit_sha="$(git rev-parse --verify HEAD)"
          safe_reviewed_ref="$(sanitize_workflow_text "$REVIEWED_REF")"

          {
            echo "## Reviewed release revision"
            printf -- '- Checked ref: `%s`\n' "$safe_reviewed_ref"
            printf -- '- Resolved commit SHA: `%s`\n' "$resolved_commit_sha"
          } >> "$GITHUB_STEP_SUMMARY"

          bash scripts/run-untrusted-checker.sh bash scripts/check-native-large-text-evidence.sh

      - name: Block release unless both native checks pass
        if: ${{ always() }}
        env:
          IOS_RESULT: ${{ needs.native-ios.result }}
          ANDROID_RESULT: ${{ needs.native-android.result }}
          IDLE_PROFILE_RESULT: ${{ needs.idle-profile-registration.result }}
          SUMMARY_REGRESSION_RESULT: ${{ needs.native-evidence-summary-regression.result }}
          TAMPER_REGRESSION_RESULT: ${{ needs.native-evidence-tamper-regression.result }}
          EVIDENCE_RESULT: ${{ steps.evidence-completeness.outcome }}
        run: |
          set -euo pipefail
          source scripts/workflow-output-safety.sh
          supported_node_range="$(
            node --input-type=module -e '
            import { readFileSync } from "node:fs";

            try {
              const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
              const configuredRange = packageJson?.engines?.node;
              if (typeof configuredRange !== "string" || configuredRange.trim() === "") {
                process.stdout.write(
                  "missing or non-string value (set package.json engines.node to a valid semver range)",
                );
              } else {
                process.stdout.write(JSON.stringify(configuredRange.trim()));
              }
            } catch {
              process.stdout.write(
                "unavailable because package.json is not valid JSON (fix package.json before rerunning)",
              );
            }
            '
          )"
          safe_supported_node_range="$(sanitize_workflow_text "$supported_node_range")"
          {
            echo "## Mobile release gate"
            echo
            echo "- Native evidence completeness: **${EVIDENCE_RESULT^^}**"
            echo "- iOS native smoke: **${IOS_RESULT^^}**"
            echo "- Android native smoke: **${ANDROID_RESULT^^}**"
            echo "- Idle profile registration: **${IDLE_PROFILE_RESULT^^}**"
            echo "- Native evidence summary regression: **${SUMMARY_REGRESSION_RESULT^^}**"
            echo "- Native evidence tamper regression: **${TAMPER_REGRESSION_RESULT^^}**"
            echo "- Supported Node.js range: ${safe_supported_node_range}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$EVIDENCE_RESULT" != "success" || "$IOS_RESULT" != "success" || "$ANDROID_RESULT" != "success" || "$IDLE_PROFILE_RESULT" != "success" || "$SUMMARY_REGRESSION_RESULT" != "success" || "$TAMPER_REGRESSION_RESULT" != "success" ]]; then
            echo "Mobile release blocked: evidence=$EVIDENCE_RESULT iOS=$IOS_RESULT Android=$ANDROID_RESULT idle-profile=$IDLE_PROFILE_RESULT summary-regression=$SUMMARY_REGRESSION_RESULT. tamper-regression=$TAMPER_REGRESSION_RESULT Supported Node.js range from package.json engines.node: ${safe_supported_node_range} (must be a valid semver range)." >&2
            exit 1
          fi
          echo "Mobile release gate passed native accessibility and idle-profile registration checks."

  mobile-publish:
    name: Publish tested mobile builds
    if: >-
      ${{
        github.event_name != 'pull_request' &&
        needs.mobile-release-gate.result == 'success' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.publish == true
      }}
    needs:
      - mobile-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: mobile-store-submission
    steps:
      - name: Check out release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}

      - name: Download iOS native smoke artifacts
        if: ${{ always() }}
        continue-on-error: true
        id: download-publish-ios-native-smoke
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-large-text-ios
          path: test-results/native-large-text/ios

      - name: Clear partial iOS native smoke artifacts before publishing retry
        if: ${{ always() && steps.download-publish-ios-native-smoke.outcome != 'success' }}
        continue-on-error: true
        id: cleanup-publish-ios-native-smoke
        run: rm -rf -- test-results/native-large-text/ios && mkdir -p -- test-results/native-large-text/ios

      - name: Retry iOS native smoke artifact download for publishing
        if: ${{ always() && steps.download-publish-ios-native-smoke.outcome != 'success' && steps.cleanup-publish-ios-native-smoke.outcome == 'success' }}
        continue-on-error: true
        id: retry-publish-ios-native-smoke
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-large-text-ios
          path: test-results/native-large-text/ios

      - name: Download Android native smoke artifacts
        if: ${{ always() }}
        continue-on-error: true
        id: download-publish-android-native-smoke
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-large-text-android
          path: test-results/native-large-text/android

      - name: Clear partial Android native smoke artifacts before publishing retry
        if: ${{ always() && steps.download-publish-android-native-smoke.outcome != 'success' }}
        continue-on-error: true
        id: cleanup-publish-android-native-smoke
        run: rm -rf -- test-results/native-large-text/android && mkdir -p -- test-results/native-large-text/android

      - name: Retry Android native smoke artifact download for publishing
        if: ${{ always() && steps.download-publish-android-native-smoke.outcome != 'success' && steps.cleanup-publish-android-native-smoke.outcome == 'success' }}
        continue-on-error: true
        id: retry-publish-android-native-smoke
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-large-text-android
          path: test-results/native-large-text/android

      - name: Run native large-text evidence privacy and submission-boundary regression
        id: native-evidence-privacy
        run: bash scripts/run-untrusted-checker.sh pnpm run test:native-large-text-evidence

      - name: Summarize native evidence privacy regression
        if: ${{ always() }}
        env:
          PRIVACY_RESULT: ${{ steps.native-evidence-privacy.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Native evidence privacy and submission-boundary regression"
            echo
            if [[ "$PRIVACY_RESULT" == "success" ]]; then
              echo "- Status: **PASS**"
              echo "- Result: privacy and submission-boundary checks passed."
            else
              echo "- Status: **BLOCKED**"
              echo "- Result: privacy checks failed; store submission is blocked."
              echo '- Details: Review the "Run native large-text evidence privacy and submission-boundary regression" step log for checker diagnostics.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach candidate-bound human approvals
        env:
          IOS_REVIEW_BUILD_ID: ${{ inputs.ios_review_candidate_build_id }}
          IOS_SUBMIT_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          ANDROID_REVIEW_BUILD_ID: ${{ inputs.android_review_candidate_build_id }}
          ANDROID_SUBMIT_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail

          reviewer="$(
            curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GH_API_URL/repos/$GH_REPOSITORY/actions/runs/$GH_RUN_ID/approvals" |
              node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => {
                  const reviews = JSON.parse(input);
                  const approval = [...reviews].reverse().find(
                    (review) =>
                      review.state === "approved" &&
                      review.environments?.some(
                        (environment) =>
                          environment.name === "mobile-store-submission",
                      ),
                  );
                  if (!approval?.user?.login) process.exit(1);
                  process.stdout.write(approval.user.login);
                });
              '
          )"
          if [[ -z "$reviewer" || "$reviewer" == *$'\n'* || "$reviewer" == *$'\r'* ]]; then
            echo "Could not verify the reviewer who approved the mobile-store-submission environment." >&2
            exit 1
          fi

          attach_approval() {
            local platform="$1"
            local approved_build_id="$2"
            local submit_build_id="$3"
            local platform_dir="test-results/native-large-text/$platform"
            local run_dirs=()
            local run_dir
            local tested_build_id
            local reviewed_at

            if [[ -z "$approved_build_id" ]]; then
              echo "Store submission requires the ${platform} review candidate build ID." >&2
              exit 1
            fi
            if [[ "$approved_build_id" == *$'\n'* || "$approved_build_id" == *$'\r'* ]]; then
              echo "The ${platform} review candidate build ID must contain exactly one line." >&2
              exit 1
            fi
            mapfile -t run_dirs < <(find "$platform_dir" -mindepth 1 -maxdepth 1 -type d -print | sort)
            if ((${#run_dirs[@]} != 1)); then
              echo "Expected exactly one ${platform} evidence run, found ${#run_dirs[@]}." >&2
              exit 1
            fi
            run_dir="${run_dirs[0]}"
            tested_build_id="$(head -n 1 "$run_dir/candidate-build-id.txt" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            if [[ "$approved_build_id" != "$tested_build_id" ]]; then
              echo "The ${platform} approval is for a different candidate build than the downloaded evidence." >&2
              exit 1
            fi
            if [[ "$submit_build_id" != "$tested_build_id" ]]; then
              echo "The ${platform} build configured for store submission does not match the downloaded and approved evidence." >&2
              exit 1
            fi
            reviewed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            {
              printf 'platform=%s\n' "$platform"
              printf 'reviewer=%s\n' "$reviewer"
              printf 'reviewed_at_utc=%s\n' "$reviewed_at"
              printf 'candidate_build_id=%s\n' "$approved_build_id"
              printf 'decision=APPROVED\n'
              printf 'approval_scope=candidate\n'
              printf 'notes=Approval supplied to the store submission workflow.\n'
            } > "$run_dir/review-record.txt"
          }

          attach_approval ios "$IOS_REVIEW_BUILD_ID" "$IOS_SUBMIT_BUILD_ID"
          attach_approval android "$ANDROID_REVIEW_BUILD_ID" "$ANDROID_SUBMIT_BUILD_ID"

      - name: Require approved iOS and Android evidence
        env:
          REVIEWED_REF: ${{ github.ref }}
          NATIVE_EVIDENCE_REQUIRE_APPROVAL: "1"
          NATIVE_IOS_EVIDENCE_ARTIFACT_URL: ${{ needs.mobile-release-gate.outputs.ios_native_evidence_artifact_url }}
          NATIVE_ANDROID_EVIDENCE_ARTIFACT_URL: ${{ needs.mobile-release-gate.outputs.android_native_evidence_artifact_url }}
          NATIVE_IOS_EVIDENCE_DIGEST_MANIFEST: ${{ needs.mobile-release-gate.outputs.ios_native_evidence_digest_manifest }}
          NATIVE_ANDROID_EVIDENCE_DIGEST_MANIFEST: ${{ needs.mobile-release-gate.outputs.android_native_evidence_digest_manifest }}
          NATIVE_IOS_EVIDENCE_DOWNLOAD_RESULT: ${{ steps.download-publish-ios-native-smoke.outcome == 'success' && 'success' || steps.retry-publish-ios-native-smoke.outcome }}
          NATIVE_ANDROID_EVIDENCE_DOWNLOAD_RESULT: ${{ steps.download-publish-android-native-smoke.outcome == 'success' && 'success' || steps.retry-publish-android-native-smoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/workflow-output-safety.sh
          resolved_commit_sha="$(git rev-parse --verify HEAD)"
          safe_reviewed_ref="$(sanitize_workflow_text "$REVIEWED_REF")"

          {
            echo "## Reviewed release revision"
            printf -- '- Checked ref: `%s`\n' "$safe_reviewed_ref"
            printf -- '- Resolved commit SHA: `%s`\n' "$resolved_commit_sha"
          } >> "$GITHUB_STEP_SUMMARY"

          bash scripts/run-untrusted-checker.sh bash scripts/check-native-large-text-evidence.sh

      - name: Verify publishing inputs
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
          IOS_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          ANDROID_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
        run: |
          set -euo pipefail
          : "${EAS_TOKEN:?Set EAS_TOKEN in the protected mobile-store-submission environment.}"
          : "${IOS_BUILD_ID:?Set the NATIVE_SMOKE_IOS_BUILD_ID repository variable.}"
          : "${ANDROID_BUILD_ID:?Set the NATIVE_SMOKE_ANDROID_BUILD_ID repository variable.}"

      - name: Submit the tested iOS and Android candidates
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
          IOS_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          ANDROID_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
        run: |
          set -euo pipefail
          pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} submit \
            --platform ios \
            --id "$IOS_BUILD_ID" \
            --non-interactive
          pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} submit \
            --platform android \
            --id "$ANDROID_BUILD_ID" \
            --non-interactive
