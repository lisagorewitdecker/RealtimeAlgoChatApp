          } >> "$GITHUB_STEP_SUMMARY"

          if GITHUB_STEP_SUMMARY="$summary_path" bash scripts/run-untrusted-checker.sh bash scripts/check-native-large-text-evidence.sh "$blocked_root"; then
            echo "The blocked native evidence scenario unexpectedly passed." >&2
            exit 1
          fi

          ios_section="$(
            awk '
              /^## iOS native large-text evidence$/ { collecting=1 }
              /^## Android native large-text evidence$/ { collecting=0 }
              collecting { print }
