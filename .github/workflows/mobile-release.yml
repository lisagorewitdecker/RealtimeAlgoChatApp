name: Mobile release accessibility gate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested candidate to both stores after the gate
        required: true
        default: false
        type: boolean
      ios_review_candidate_build_id:
        description: Approved iOS candidate build ID (must match the tested build)
        required: false
        type: string
      android_review_candidate_build_id:
        description: Approved Android candidate build ID (must match the tested build)
        required: false
        type: string
  push:
    tags:
      - "mobile-v*"
  workflow_call:
    inputs:
      native_smoke_ios_build_id:
        description: Non-secret EAS build ID of the iOS candidate
        required: true
        type: string
      native_smoke_android_build_id:
        description: Non-secret EAS build ID of the Android candidate
        required: true
        type: string
    secrets:
      EAS_TOKEN:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
      NATIVE_SMOKE_IOS_APP_ID:
        required: true
      NATIVE_SMOKE_ANDROID_APP_ID:
        required: true
      NATIVE_SMOKE_EMAIL:
        required: true
      NATIVE_SMOKE_PASSWORD:
        required: true
      NATIVE_SMOKE_DISPLAY_NAME:
        required: false
      NATIVE_SMOKE_IOS_SENTRY_RELEASE:
        required: true
      NATIVE_SMOKE_IOS_SENTRY_DIST:
        required: true
      NATIVE_SMOKE_ANDROID_SENTRY_RELEASE:
        required: true
      NATIVE_SMOKE_ANDROID_SENTRY_DIST:
        required: true
      E2E_CHAT_URL:
        required: true
      E2E_API_URL:
        required: true
      CLERK_PUBLISHABLE_KEY:
        required: true
      CLERK_SECRET_KEY:
        required: true
      DATABASE_URL:
        required: true

permissions:
  actions: read
  contents: read
  actions: write

env:
  PNPM_VERSION: 10.26.1
  EAS_CLI_VERSION: 23.2.0
  NATIVE_SMOKE_IOS_BUILD_ID: ${{ inputs.native_smoke_ios_build_id || vars.NATIVE_SMOKE_IOS_BUILD_ID }}
  NATIVE_SMOKE_ANDROID_BUILD_ID: ${{ inputs.native_smoke_android_build_id || vars.NATIVE_SMOKE_ANDROID_BUILD_ID }}

jobs:
  native-ios:
    name: Native large-text smoke (iOS)
    runs-on:
      - self-hosted
      - macos
      - ios
      - smallest-simulator
    environment:
      name: mobile-release
    env:
      NATIVE_SMOKE_RESULTS_DIR: ${{ github.workspace }}/test-results/native-large-text/ios/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4

      - name: Clear prior iOS evidence from this runner
        run: rm -rf test-results/native-large-text/ios

      - name: Set up pnpm
        id: setup-pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        id: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify app branding
        id: app-branding
        run: pnpm --filter @workspace/chat-app run validate:branding

      - name: Verify iOS release configuration
        id: ios-release-configuration
        env:
          NATIVE_SMOKE_IOS_APP_ID: ${{ secrets.NATIVE_SMOKE_IOS_APP_ID }}
          NATIVE_SMOKE_IOS_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          NATIVE_SMOKE_EMAIL: ${{ secrets.NATIVE_SMOKE_EMAIL }}
          NATIVE_SMOKE_PASSWORD: ${{ secrets.NATIVE_SMOKE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for value in \
            NATIVE_SMOKE_IOS_APP_ID \
            NATIVE_SMOKE_IOS_BUILD_ID \
            NATIVE_SMOKE_EMAIL \
            NATIVE_SMOKE_PASSWORD; do
            if [[ -z "${!value:-}" ]]; then
              echo "Required iOS release configuration is incomplete." >&2
              exit 2
            fi
          done

      - name: Verify iOS simulator tooling
        id: ios-xcrun
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcrun >/dev/null 2>&1; then
            echo "xcrun is required on the prepared iOS runner." >&2
            exit 2
          fi

      - name: Verify prepared iPhone SE simulator
        id: ios-simulator
        shell: bash
        run: |
          set -euo pipefail
          booted_devices="$(xcrun simctl list devices booted)"
          device_udid="$(
            sed -n 's/^[[:space:]]*iPhone SE (3rd generation) (\([0-9A-F-]\{8,\}\)) (Booted)$/\1/p' <<<"$booted_devices" |
              head -n 1
          )"
          if [[ -z "$device_udid" ]]; then
            echo "A booted iPhone SE (3rd generation) is required on the iOS runner." >&2
            xcrun simctl list devices booted >&2
            exit 2
          fi
          printf 'NATIVE_SMOKE_IOS_DEVICE_UDID=%s\n' "$device_udid" >> "$GITHUB_ENV"
          echo "Prepared iPhone SE (3rd generation): $device_udid"

      - name: Inspect installed iOS native branding
        id: ios-native-branding
        env:
          NATIVE_SMOKE_APP_ID: ${{ secrets.NATIVE_SMOKE_IOS_APP_ID }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          NATIVE_SMOKE_IOS_DEVICE_UDID: ${{ env.NATIVE_SMOKE_IOS_DEVICE_UDID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$NATIVE_SMOKE_RESULTS_DIR"
          device_udid="${NATIVE_SMOKE_IOS_DEVICE_UDID:-}"
          if [[ -z "$device_udid" ]]; then
            echo "The prepared iPhone SE simulator UDID was not carried forward from verification." >&2
            exit 2
          fi
          app_container="$(xcrun simctl get_app_container "$device_udid" "$NATIVE_SMOKE_APP_ID" app)"
          if [[ ! -f "$app_container/Info.plist" ]]; then
            echo "The release candidate is not installed on the prepared iOS simulator." >&2
            exit 2
          fi
          if ! LC_ALL=C grep -aR -Fq "SENTRY_RELEASE_PREFLIGHT_PASSED_V1" "$app_container"; then
            echo "The installed iOS candidate does not contain crash-reporting preflight evidence. Rebuild it with SENTRY_DSN or EXPO_PUBLIC_SENTRY_DSN configured." >&2
            exit 2
          fi
          echo "Verified crash-reporting preflight evidence in the installed iOS candidate."
          metadata_path="$NATIVE_SMOKE_RESULTS_DIR/native-info.json"
          plutil -convert json -o "$metadata_path" "$app_container/Info.plist"
          pnpm --filter @workspace/chat-app run validate:branding:native -- \
            --platform ios \
            --metadata "$metadata_path" \
            --build-id "$NATIVE_SMOKE_BUILD_ID" \
            --results-dir "$NATIVE_SMOKE_RESULTS_DIR"

      - name: Verify Maestro
        id: ios-maestro
        run: maestro --version

      - name: Run iOS native large-text release gate
        id: ios-native-evidence
        env:
          NATIVE_SMOKE_APP_ID: ${{ secrets.NATIVE_SMOKE_IOS_APP_ID }}
          NATIVE_SMOKE_EMAIL: ${{ secrets.NATIVE_SMOKE_EMAIL }}
          NATIVE_SMOKE_PASSWORD: ${{ secrets.NATIVE_SMOKE_PASSWORD }}
          NATIVE_SMOKE_DISPLAY_NAME: ${{ secrets.NATIVE_SMOKE_DISPLAY_NAME }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          NATIVE_SMOKE_IOS_DEVICE_UDID: ${{ env.NATIVE_SMOKE_IOS_DEVICE_UDID }}
          NATIVE_SMOKE_SUMMARY_DEFER: "1"
        run: pnpm --filter @workspace/chat-app test:native-large-text ios

      - name: Send controlled iOS JavaScript error
        id: ios-sentry-trigger
        env:
          NATIVE_SMOKE_APP_ID: ${{ secrets.NATIVE_SMOKE_IOS_APP_ID }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          NATIVE_SMOKE_IOS_DEVICE_UDID: ${{ env.NATIVE_SMOKE_IOS_DEVICE_UDID }}
          NATIVE_SENTRY_MARKER: native-${{ github.run_id }}-${{ github.run_attempt }}-ios
        run: pnpm --filter @workspace/chat-app test:native-sentry ios

      - name: Verify readable iOS source maps in Sentry
        id: ios-sentry-verification
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_EXPECTED_PLATFORM: ios
          SENTRY_EXPECTED_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          SENTRY_EXPECTED_RELEASE: ${{ secrets.NATIVE_SMOKE_IOS_SENTRY_RELEASE }}
          SENTRY_EXPECTED_DIST: ${{ secrets.NATIVE_SMOKE_IOS_SENTRY_DIST }}
          SENTRY_PROBE_MARKER: native-${{ github.run_id }}-${{ github.run_attempt }}-ios
          SENTRY_EVIDENCE_PATH: ${{ env.NATIVE_SMOKE_RESULTS_DIR }}/sentry-source-map-evidence.json
        run: node scripts/verify-sentry-native-event.mjs

      - name: Summarize iOS readiness
        if: always()
        env:
          IOS_RESULTS_DIR: ${{ env.NATIVE_SMOKE_RESULTS_DIR }}
          WORKSPACE_RESULT: ${{ steps.install-dependencies.outcome }}
          APP_BRANDING_RESULT: ${{ steps.app-branding.outcome }}
          IOS_RELEASE_CONFIGURATION_RESULT: ${{ steps.ios-release-configuration.outcome }}
          IOS_XCRUN_RESULT: ${{ steps.ios-xcrun.outcome }}
          IOS_SIMULATOR_RESULT: ${{ steps.ios-simulator.outcome }}
          IOS_NATIVE_BRANDING_RESULT: ${{ steps.ios-native-branding.outcome }}
          IOS_MAESTRO_RESULT: ${{ steps.ios-maestro.outcome }}
          IOS_NATIVE_EVIDENCE_RESULT: ${{ steps.ios-native-evidence.outcome }}
          IOS_SENTRY_TRIGGER_RESULT: ${{ steps.ios-sentry-trigger.outcome }}
          IOS_SENTRY_VERIFICATION_RESULT: ${{ steps.ios-sentry-verification.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          status="READY"
          blockers=()
          checks=()

          add_check() {
            local label="$1"
            local result="$2"
            if [[ "$result" == "success" ]]; then
              checks+=("- ${label}: **READY**")
            else
              status="BLOCKED"
              checks+=("- ${label}: **BLOCKED**")
              blockers+=("${label}")
            fi
          }

          add_check "Workspace dependencies" "$WORKSPACE_RESULT"
          add_check "App branding source" "$APP_BRANDING_RESULT"
          add_check "Release configuration" "$IOS_RELEASE_CONFIGURATION_RESULT"
          add_check "Xcode simulator tooling" "$IOS_XCRUN_RESULT"
          add_check "Booted iPhone SE (3rd generation)" "$IOS_SIMULATOR_RESULT"
          add_check "Installed native candidate" "$IOS_NATIVE_BRANDING_RESULT"
          add_check "Maestro" "$IOS_MAESTRO_RESULT"
          add_check "Native large-text evidence" "$IOS_NATIVE_EVIDENCE_RESULT"
          add_check "Controlled Sentry error" "$IOS_SENTRY_TRIGGER_RESULT"
          add_check "Readable Sentry source maps" "$IOS_SENTRY_VERIFICATION_RESULT"

          {
            echo "## iOS native large-text readiness"
            echo
            echo "- Status: **${status}**"
            echo
            echo "### Prerequisites"
            printf '%s\n' "${checks[@]}"
            if [[ -f "$IOS_RESULTS_DIR/ios-readiness.md" ]]; then
              diagnostics="$(
                awk '
                  /^### Blocking prerequisites$/ { collecting=1; next }
                  collecting && /^- / { print; next }
                  collecting && !/^- / { exit }
                ' "$IOS_RESULTS_DIR/ios-readiness.md"
              )"
              if [[ -n "$diagnostics" ]]; then
                echo
                echo "### Readiness diagnostics"
                printf '%s\n' "$diagnostics"
              fi
            fi
            if ((${#blockers[@]})); then
              echo
              echo "### Blocking prerequisites"
              printf -- '- %s\n' "${blockers[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS native smoke artifacts
        if: always()
        id: upload-ios-native-smoke
        uses: actions/upload-artifact@v4
        with:
          name: native-large-text-ios
          path: test-results/native-large-text/ios/**
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Summarize iOS native branding
        if: always()
        env:
          IOS_RESULTS_DIR: ${{ env.NATIVE_SMOKE_RESULTS_DIR }}
          IOS_BRANDING_ARTIFACT_URL: ${{ steps.upload-ios-native-smoke.outputs.artifact-url }}
          IOS_NATIVE_BRANDING_RESULT: ${{ steps.ios-native-branding.outcome }}
          IOS_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
        shell: bash
        run: |
          set -euo pipefail
          report_url="${IOS_BRANDING_ARTIFACT_URL:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"
          summary_path="$IOS_RESULTS_DIR/native-branding-summary.md"
          if [[ -f "$summary_path" ]]; then
            sed "s|__NATIVE_BRANDING_REPORT_URL__|${report_url}|g" \
              "$summary_path" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## iOS native branding"
              echo
              echo "- Status: **FAIL**"
              echo "- Candidate build ID: \`${IOS_BUILD_ID}\`"
              echo "- Candidate build fingerprint (SHA-256): \`$(printf '%s' "$IOS_BUILD_ID" | shasum -a 256 | awk '{print $1}')\`"
              echo "- Native label: \`Unavailable\`"
              echo "- Permission copy: **UNAVAILABLE** (native metadata was not inspected)"
              echo "- Detailed report: [native-branding-check.md](${report_url})"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  android-prerequisite-preflight:
    name: Android release runner preflight
    runs-on:
      - self-hosted
      - linux
      - android
      - smallest-simulator
    environment:
      name: mobile-release
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4

      - name: Check Android release prerequisites
        env:
          NATIVE_SMOKE_APP_ID: ${{ secrets.NATIVE_SMOKE_ANDROID_APP_ID }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
          NATIVE_SMOKE_EMAIL: ${{ secrets.NATIVE_SMOKE_EMAIL }}
          NATIVE_SMOKE_PASSWORD: ${{ secrets.NATIVE_SMOKE_PASSWORD }}
          NATIVE_SMOKE_DISPLAY_NAME: ${{ secrets.NATIVE_SMOKE_DISPLAY_NAME }}
        run: bash scripts/check-android-release-prerequisites.sh

  native-android:
    name: Native large-text smoke (Android)
    needs:
      - android-prerequisite-preflight
    runs-on:
      - self-hosted
      - linux
      - android
      - smallest-simulator
    environment:
      name: mobile-release
    env:
      NATIVE_SMOKE_RESULTS_DIR: ${{ github.workspace }}/test-results/native-large-text/android/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4

      - name: Clear prior Android evidence from this runner
        run: rm -rf test-results/native-large-text/android

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify app branding
        run: pnpm --filter @workspace/chat-app run validate:branding

      - name: Verify prepared smallest Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v adb >/dev/null 2>&1; then
            echo "adb is required on the prepared Android runner." >&2
            exit 2
          fi
          timeout 60s adb wait-for-device
          adb get-state >/dev/null
          size="$(adb shell wm size | tr -d '\r' | tail -n 1 | sed 's/^.*: //')"
          density="$(adb shell wm density | tr -d '\r' | tail -n 1 | sed 's/^.*: //')"
          IFS=x read -r width_px height_px <<<"$size"
          if [[ ! "$width_px" =~ ^[0-9]+$ || ! "$height_px" =~ ^[0-9]+$ || ! "$density" =~ ^[0-9]+$ ]]; then
            echo "Could not determine Android emulator size and density." >&2
            exit 2
          fi
          width_dp=$((width_px * 160 / density))
          height_dp=$((height_px * 160 / density))
          if ((width_dp > 320 || height_dp > 568)); then
            echo "The Android runner must use an emulator at or below 320x568 dp; found ${width_dp}x${height_dp} dp." >&2
            exit 2
          fi
          rotation="$(adb shell settings get system user_rotation | tr -d '\r' | tr -d '[:space:]')"
          if [[ "$rotation" != "0" && "$rotation" != "2" ]]; then
            echo "The Android runner must be in portrait orientation; found user_rotation=${rotation:-unknown}." >&2
            exit 2
          fi

      - name: Inspect installed Android native branding
        id: android-native-branding
        env:
          NATIVE_SMOKE_APP_ID: ${{ secrets.NATIVE_SMOKE_ANDROID_APP_ID }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$NATIVE_SMOKE_RESULTS_DIR"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          aapt2_path="$(command -v aapt2 || true)"
          if [[ -z "$aapt2_path" && -n "$sdk_root" && -d "$sdk_root/build-tools" ]]; then
            aapt2_path="$(
              find "$sdk_root/build-tools" -type f -name aapt2 -perm -111 |
                sort -V |
                tail -n 1
            )"
          fi
          if [[ -z "$aapt2_path" || ! -x "$aapt2_path" ]]; then
            echo "aapt2 is required to inspect the compiled Android manifest." >&2
            exit 2
          fi
          apk_source="$(adb shell pm path "$NATIVE_SMOKE_APP_ID" | tr -d '\r' | sed -n 's/^package://p' | head -n 1)"
          if [[ -z "$apk_source" ]]; then
            echo "Could not locate the release candidate APK on the prepared Android device." >&2
            exit 2
          fi
          apk_path="$RUNNER_TEMP/realtime-algo-chat-app.apk"
          adb pull "$apk_source" "$apk_path"
          apk_extract_dir="$RUNNER_TEMP/realtime-algo-chat-app-extracted"
          rm -rf "$apk_extract_dir"
          unzip -q "$apk_path" -d "$apk_extract_dir"
          if ! LC_ALL=C grep -aR -Fq "SENTRY_RELEASE_PREFLIGHT_PASSED_V1" "$apk_extract_dir"; then
            echo "The installed Android candidate does not contain crash-reporting preflight evidence. Rebuild it with SENTRY_DSN or EXPO_PUBLIC_SENTRY_DSN configured." >&2
            exit 2
          fi
          echo "Verified crash-reporting preflight evidence in the installed Android candidate."
          badging_path="$NATIVE_SMOKE_RESULTS_DIR/android-badging.txt"
          "$aapt2_path" dump badging "$apk_path" > "$badging_path"
          metadata_path="$NATIVE_SMOKE_RESULTS_DIR/native-info.json"
          node --input-type=module - "$badging_path" "$metadata_path" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const [, , badgingPath, metadataPath] = process.argv;
          const badging = readFileSync(badgingPath, "utf8");
          const label = badging.match(/^application-label:'([^']*)'$/m)?.[1];
          const permissions = [...badging.matchAll(
            /^uses-permission: name='([^']+)'/gm,
          )].map((match) => match[1]);
          if (!label) {
            throw new Error("aapt2 did not report an Android application label.");
          }
          writeFileSync(
            metadataPath,
            `${JSON.stringify({ applicationLabel: label, permissions }, null, 2)}\n`,
          );
          NODE
          pnpm --filter @workspace/chat-app run validate:branding:native -- \
            --platform android \
            --metadata "$metadata_path" \
            --build-id "$NATIVE_SMOKE_BUILD_ID" \
            --results-dir "$NATIVE_SMOKE_RESULTS_DIR"

      - name: Verify Maestro
        run: maestro --version

      - name: Run Android native large-text release gate
        id: android-native-evidence
        env:
          NATIVE_SMOKE_APP_ID: ${{ secrets.NATIVE_SMOKE_ANDROID_APP_ID }}
          NATIVE_SMOKE_EMAIL: ${{ secrets.NATIVE_SMOKE_EMAIL }}
          NATIVE_SMOKE_PASSWORD: ${{ secrets.NATIVE_SMOKE_PASSWORD }}
          NATIVE_SMOKE_DISPLAY_NAME: ${{ secrets.NATIVE_SMOKE_DISPLAY_NAME }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
        run: pnpm --filter @workspace/chat-app test:native-large-text android

      - name: Send controlled Android JavaScript error
        id: android-sentry-trigger
        env:
          NATIVE_SMOKE_APP_ID: ${{ secrets.NATIVE_SMOKE_ANDROID_APP_ID }}
          NATIVE_SMOKE_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
          NATIVE_SENTRY_MARKER: native-${{ github.run_id }}-${{ github.run_attempt }}-android
        run: pnpm --filter @workspace/chat-app test:native-sentry android

      - name: Verify readable Android source maps in Sentry
        id: android-sentry-verification
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_EXPECTED_PLATFORM: android
          SENTRY_EXPECTED_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
          SENTRY_EXPECTED_RELEASE: ${{ secrets.NATIVE_SMOKE_ANDROID_SENTRY_RELEASE }}
          SENTRY_EXPECTED_DIST: ${{ secrets.NATIVE_SMOKE_ANDROID_SENTRY_DIST }}
          SENTRY_PROBE_MARKER: native-${{ github.run_id }}-${{ github.run_attempt }}-android
          SENTRY_EVIDENCE_PATH: ${{ env.NATIVE_SMOKE_RESULTS_DIR }}/sentry-source-map-evidence.json
        run: node scripts/verify-sentry-native-event.mjs

      - name: Upload Android native smoke artifacts
        if: always()
        id: upload-android-native-smoke
        uses: actions/upload-artifact@v4
        with:
          name: native-large-text-android
          path: test-results/native-large-text/android/**
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Summarize Android native branding
        if: always()
        env:
          ANDROID_RESULTS_DIR: ${{ env.NATIVE_SMOKE_RESULTS_DIR }}
          ANDROID_BRANDING_ARTIFACT_URL: ${{ steps.upload-android-native-smoke.outputs.artifact-url }}
          ANDROID_NATIVE_BRANDING_RESULT: ${{ steps.android-native-branding.outcome }}
          ANDROID_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
        shell: bash
        run: |
          set -euo pipefail
          report_url="${ANDROID_BRANDING_ARTIFACT_URL:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"
          summary_path="$ANDROID_RESULTS_DIR/native-branding-summary.md"
          if [[ -f "$summary_path" ]]; then
            sed "s|__NATIVE_BRANDING_REPORT_URL__|${report_url}|g" \
              "$summary_path" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Android native branding"
              echo
              echo "- Status: **FAIL**"
              echo "- Candidate build ID: \`${ANDROID_BUILD_ID}\`"
              echo "- Candidate build fingerprint (SHA-256): \`$(printf '%s' "$ANDROID_BUILD_ID" | sha256sum | awk '{print $1}')\`"
              echo "- Native label: \`Unavailable\`"
              echo "- Permission declarations: **UNAVAILABLE** (native metadata was not inspected)"
              echo "- Detailed report: [native-branding-check.md](${report_url})"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  idle-profile-registration:
    name: Idle profile registration
    runs-on: ubuntu-latest
    environment:
      name: mobile-release
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify idle-profile browser targets
        env:
          E2E_CHAT_URL: ${{ secrets.E2E_CHAT_URL }}
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          check_target() {
            local label="$1"
            local url="$2"
            if ! curl \
              --fail \
              --silent \
              --connect-timeout 5 \
              --max-time 10 \
              --output /dev/null \
              "$url"; then
              echo "${label} target is unavailable or unhealthy." >&2
              exit 2
            fi
            echo "${label} target is ready."
          }

          if [[ -z "${E2E_CHAT_URL:-}" || -z "${E2E_API_URL:-}" ]]; then
            echo "Idle-profile browser target configuration is incomplete." >&2
            exit 2
          fi
          check_target "Chat App" "$E2E_CHAT_URL"
          check_target "API" "${E2E_API_URL%/}/api/healthz"

      - name: Run idle-profile registration release check
        id: idle-profile-check
        env:
          E2E_CHAT_URL: ${{ secrets.E2E_CHAT_URL }}
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for value in \
            E2E_CHAT_URL \
            E2E_API_URL \
            CLERK_PUBLISHABLE_KEY \
            CLERK_SECRET_KEY \
            DATABASE_URL; do
            if [[ -z "${!value:-}" ]]; then
              echo "Required idle-profile release configuration is incomplete." >&2
              exit 2
            fi
          done
          pnpm --filter @workspace/api-server run test:e2e:idle-profile-registration

      - name: Upload idle-profile browser failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: idle-profile-registration-browser-evidence
          path: artifacts/api-server/test-results/**
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Summarize idle-profile registration check
        if: ${{ always() }}
        env:
          IDLE_PROFILE_RESULT: ${{ steps.idle-profile-check.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Idle profile registration"
            echo
            if [[ "$IDLE_PROFILE_RESULT" == "success" ]]; then
              echo "- Status: **PASS**"
              echo "- Result: the idle client did not repeat \`PUT /api/profile\` after token refresh."
            else
              echo "- Status: **FAIL**"
              echo "- Result: release is blocked because the idle-profile registration check did not pass."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  mobile-release-gate:
    name: Mobile release gate
    if: ${{ always() }}
    needs:
      - native-ios
      - native-android
      - idle-profile-registration
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4

      - name: Download iOS native smoke artifacts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: native-large-text-ios
          path: test-results/native-large-text/ios

      - name: Download Android native smoke artifacts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: native-large-text-android
          path: test-results/native-large-text/android

      - name: Validate native evidence completeness
        id: evidence-completeness
        if: ${{ always() }}
        continue-on-error: true
        run: bash scripts/check-native-large-text-evidence.sh

      - name: Block release unless both native checks pass
        if: ${{ always() }}
        env:
          IOS_RESULT: ${{ needs.native-ios.result }}
          ANDROID_RESULT: ${{ needs.native-android.result }}
          IDLE_PROFILE_RESULT: ${{ needs.idle-profile-registration.result }}
          EVIDENCE_RESULT: ${{ steps.evidence-completeness.outcome }}
        run: |
          set -euo pipefail
          if [[ "$EVIDENCE_RESULT" != "success" || "$IOS_RESULT" != "success" || "$ANDROID_RESULT" != "success" || "$IDLE_PROFILE_RESULT" != "success" ]]; then
            echo "Mobile release blocked: evidence=$EVIDENCE_RESULT iOS=$IOS_RESULT Android=$ANDROID_RESULT idle-profile=$IDLE_PROFILE_RESULT." >&2
            exit 1
          fi
          echo "Mobile release gate passed native accessibility and idle-profile registration checks."

  mobile-publish:
    name: Publish tested mobile builds
    if: >-
      ${{
        needs.mobile-release-gate.result == 'success' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.publish == true
      }}
    needs:
      - mobile-release-gate
    runs-on: ubuntu-latest
    environment:
      name: mobile-store-submission
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download iOS native smoke artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-large-text-ios
          path: test-results/native-large-text/ios

      - name: Download Android native smoke artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-large-text-android
          path: test-results/native-large-text/android

      - name: Attach candidate-bound human approvals
        env:
          IOS_REVIEW_BUILD_ID: ${{ inputs.ios_review_candidate_build_id }}
          IOS_SUBMIT_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          ANDROID_REVIEW_BUILD_ID: ${{ inputs.android_review_candidate_build_id }}
          ANDROID_SUBMIT_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail

          reviewer="$(
            curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GH_API_URL/repos/$GH_REPOSITORY/actions/runs/$GH_RUN_ID/approvals" |
              node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => {
                  const reviews = JSON.parse(input);
                  const approval = [...reviews].reverse().find(
                    (review) =>
                      review.state === "approved" &&
                      review.environments?.some(
                        (environment) =>
                          environment.name === "mobile-store-submission",
                      ),
                  );
                  if (!approval?.user?.login) process.exit(1);
                  process.stdout.write(approval.user.login);
                });
              '
          )"
          if [[ -z "$reviewer" || "$reviewer" == *$'\n'* || "$reviewer" == *$'\r'* ]]; then
            echo "Could not verify the reviewer who approved the mobile-store-submission environment." >&2
            exit 1
          fi

          attach_approval() {
            local platform="$1"
            local approved_build_id="$2"
            local submit_build_id="$3"
            local platform_dir="test-results/native-large-text/$platform"
            local run_dirs=()
            local run_dir
            local tested_build_id
            local reviewed_at

            if [[ -z "$approved_build_id" ]]; then
              echo "Store submission requires the ${platform} review candidate build ID." >&2
              exit 1
            fi
            if [[ "$approved_build_id" == *$'\n'* || "$approved_build_id" == *$'\r'* ]]; then
              echo "The ${platform} review candidate build ID must contain exactly one line." >&2
              exit 1
            fi
            mapfile -t run_dirs < <(find "$platform_dir" -mindepth 1 -maxdepth 1 -type d -print | sort)
            if ((${#run_dirs[@]} != 1)); then
              echo "Expected exactly one ${platform} evidence run, found ${#run_dirs[@]}." >&2
              exit 1
            fi
            run_dir="${run_dirs[0]}"
            tested_build_id="$(head -n 1 "$run_dir/candidate-build-id.txt" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            if [[ "$approved_build_id" != "$tested_build_id" ]]; then
              echo "The ${platform} approval is for a different candidate build than the downloaded evidence." >&2
              exit 1
            fi
            if [[ "$submit_build_id" != "$tested_build_id" ]]; then
              echo "The ${platform} build configured for store submission does not match the downloaded and approved evidence." >&2
              exit 1
            fi
            reviewed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            {
              printf 'platform=%s\n' "$platform"
              printf 'reviewer=%s\n' "$reviewer"
              printf 'reviewed_at_utc=%s\n' "$reviewed_at"
              printf 'candidate_build_id=%s\n' "$approved_build_id"
              printf 'decision=APPROVED\n'
              printf 'approval_scope=candidate\n'
              printf 'notes=Approval supplied to the store submission workflow.\n'
            } > "$run_dir/review-record.txt"
          }

          attach_approval ios "$IOS_REVIEW_BUILD_ID" "$IOS_SUBMIT_BUILD_ID"
          attach_approval android "$ANDROID_REVIEW_BUILD_ID" "$ANDROID_SUBMIT_BUILD_ID"

      - name: Require approved iOS and Android evidence
        env:
          NATIVE_EVIDENCE_REQUIRE_APPROVAL: "1"
        run: bash scripts/check-native-large-text-evidence.sh

      - name: Verify publishing inputs
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
          IOS_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          ANDROID_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
        run: |
          set -euo pipefail
          : "${EAS_TOKEN:?Set EAS_TOKEN in the mobile-release environment.}"
          : "${IOS_BUILD_ID:?Set the NATIVE_SMOKE_IOS_BUILD_ID repository variable.}"
          : "${ANDROID_BUILD_ID:?Set the NATIVE_SMOKE_ANDROID_BUILD_ID repository variable.}"

      - name: Submit the tested iOS and Android candidates
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
          IOS_BUILD_ID: ${{ env.NATIVE_SMOKE_IOS_BUILD_ID }}
          ANDROID_BUILD_ID: ${{ env.NATIVE_SMOKE_ANDROID_BUILD_ID }}
        run: |
          set -euo pipefail
          pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} submit \
            --platform ios \
            --id "$IOS_BUILD_ID" \
            --non-interactive
          pnpm dlx eas-cli@${{ env.EAS_CLI_VERSION }} submit \
            --platform android \
            --id "$ANDROID_BUILD_ID" \
            --non-interactive
