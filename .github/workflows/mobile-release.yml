name: Mobile release accessibility gate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested candidate to both stores after the gate
        required: true
        default: false
        type: boolean
      ios_review_candidate_build_id:
        description: Approved iOS candidate build ID (must match the tested build)
        required: false
        type: string
      android_review_candidate_build_id:
        description: Approved Android candidate build ID (must match the tested build)
        required: false
        type: string
      node_range_override:
        description: Optional Node range fixture for validating the release guard
        required: false
        type: string
  push:
    tags:
      - "mobile-v*"
  pull_request:
  workflow_call:
    inputs:
      native_smoke_ios_build_id:
        description: Non-secret EAS build ID of the iOS candidate
        required: true
        type: string
      native_smoke_android_build_id:
        description: Non-secret EAS build ID of the Android candidate
        required: true
        type: string
      node_range_override:
        description: Optional Node range fixture for validating the release guard
        required: false
        type: string
    secrets:
      EAS_TOKEN:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      NATIVE_SMOKE_IOS_APP_ID:
        required: false
      NATIVE_SMOKE_ANDROID_APP_ID:
        required: false
      NATIVE_SMOKE_EMAIL:
        required: false
      NATIVE_SMOKE_PASSWORD:
        required: false
      NATIVE_SMOKE_DISPLAY_NAME:
        required: false
      NATIVE_SMOKE_IOS_SENTRY_RELEASE:
        required: false
      NATIVE_SMOKE_IOS_SENTRY_DIST:
        required: false
      NATIVE_SMOKE_ANDROID_SENTRY_RELEASE:
        required: false
      NATIVE_SMOKE_ANDROID_SENTRY_DIST:
        required: false
      E2E_CHAT_URL:
        required: false
      E2E_API_URL:
        required: false
      CLERK_PUBLISHABLE_KEY:
        required: false
      CLERK_SECRET_KEY:
        required: false
      DATABASE_URL:
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: mobile-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # Keep every release job on the same concrete Node.js line and let the guard
  # plus contract tests catch any drift from package.json engines.node.
  RELEASE_NODE_VERSION: 24
  PNPM_VERSION: 10.26.1
  EAS_CLI_VERSION: 23.2.0
  NATIVE_SMOKE_IOS_BUILD_ID: ${{ inputs.native_smoke_ios_build_id || vars.NATIVE_SMOKE_IOS_BUILD_ID }}
  NATIVE_SMOKE_ANDROID_BUILD_ID: ${{ inputs.native_smoke_android_build_id || vars.NATIVE_SMOKE_ANDROID_BUILD_ID }}

jobs:
  mobile-release-node-range:
    name: Validate mobile release Node range
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read package.json Node range
        id: read-node-range
        env:
          NODE_RANGE_OVERRIDE: ${{ inputs.node_range_override }}
        run: |
          set -euo pipefail
          node_range="${NODE_RANGE_OVERRIDE:-}"
          if [[ -z "$node_range" ]]; then
            node_range="$(
              node --input-type=module -e '
              import { readFileSync } from "node:fs";

              try {
                const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
                const configuredRange = packageJson?.engines?.node;
                if (typeof configuredRange === "string" && configuredRange.trim() !== "") {
                  process.stdout.write(configuredRange.trim());
                }
              } catch {
                // The validation step below reports malformed package.json as an invalid range.
              }
              '
            )"
          fi
          if [[ -z "$node_range" ]]; then
            node_range="missing or non-string value"
          fi
          {
            echo "node_range<<NODE_RANGE"
            printf '%s\n' "$node_range"
            echo "NODE_RANGE"
          } >> "$GITHUB_OUTPUT"
          echo "Validating package.json engines.node range: $(printf '%q' "$node_range")"

      - name: Resolve configured Node range
        id: resolve-node-range
        continue-on-error: true
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.read-node-range.outputs.node_range }}

      - name: Reject invalid Node range before release checks
        if: ${{ always() }}
        env:
          NODE_RANGE: ${{ steps.read-node-range.outputs.node_range }}
          RESOLVE_RESULT: ${{ steps.resolve-node-range.outcome }}
        run: |
          set -euo pipefail
          source scripts/workflow-output-safety.sh
          if [[ "$RESOLVE_RESULT" != "success" ]]; then
            safe_node_range="$(sanitize_workflow_text "$NODE_RANGE")"
            {
              echo "## Mobile release Node range"
              echo
              echo "- Status: **FAIL**"
              echo "- Failure: release checks were not started."
              echo "- package.json engines.node: \`$safe_node_range\`"
              echo "- The configured Node range is unsupported; provide a valid semver range."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Mobile release blocked before release checks: package.json engines.node contains an unsupported range: $safe_node_range" >&2
            exit 1
          fi
          echo "Mobile release Node range is valid: $(sanitize_workflow_text "$NODE_RANGE")"

  mobile-release-credentials:
    name: Validate mobile release credentials
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - mobile-release-node-range
    runs-on: ubuntu-latest
    environment:
      name: mobile-release
    steps:
      - name: Report every missing required release credential
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NATIVE_SMOKE_IOS_APP_ID: ${{ secrets.NATIVE_SMOKE_IOS_APP_ID }}
          NATIVE_SMOKE_ANDROID_APP_ID: ${{ secrets.NATIVE_SMOKE_ANDROID_APP_ID }}
          NATIVE_SMOKE_EMAIL: ${{ secrets.NATIVE_SMOKE_EMAIL }}
          NATIVE_SMOKE_PASSWORD: ${{ secrets.NATIVE_SMOKE_PASSWORD }}
          NATIVE_SMOKE_IOS_SENTRY_RELEASE: ${{ secrets.NATIVE_SMOKE_IOS_SENTRY_RELEASE }}
          NATIVE_SMOKE_IOS_SENTRY_DIST: ${{ secrets.NATIVE_SMOKE_IOS_SENTRY_DIST }}
          NATIVE_SMOKE_ANDROID_SENTRY_RELEASE: ${{ secrets.NATIVE_SMOKE_ANDROID_SENTRY_RELEASE }}
          NATIVE_SMOKE_ANDROID_SENTRY_DIST: ${{ secrets.NATIVE_SMOKE_ANDROID_SENTRY_DIST }}
          E2E_CHAT_URL: ${{ secrets.E2E_CHAT_URL }}
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          required_credentials=(
            SENTRY_AUTH_TOKEN
            NATIVE_SMOKE_IOS_APP_ID
            NATIVE_SMOKE_ANDROID_APP_ID
            NATIVE_SMOKE_EMAIL
            NATIVE_SMOKE_PASSWORD
            NATIVE_SMOKE_IOS_SENTRY_RELEASE
            NATIVE_SMOKE_IOS_SENTRY_DIST
            NATIVE_SMOKE_ANDROID_SENTRY_RELEASE
            NATIVE_SMOKE_ANDROID_SENTRY_DIST
            E2E_CHAT_URL
            E2E_API_URL
            CLERK_PUBLISHABLE_KEY
            CLERK_SECRET_KEY
            DATABASE_URL
          )
          missing_credentials=()
          for credential in "${required_credentials[@]}"; do
            if [[ -z "${!credential:-}" ]]; then
              missing_credentials+=("$credential")
            fi
          done

          if ((${#missing_credentials[@]} > 0)); then
            echo "Mobile release setup is missing required credential keys:" >&2
            printf -- '- %s\n' "${missing_credentials[@]}" >&2
            echo "Add every listed key to the mobile-release environment, then retry." >&2
            exit 1
          fi

          echo "All required mobile release credential keys are configured."

  android-preview-evidence:
    # Keep this display name synchronized with the required check in the repository ruleset.
    name: Android preview evidence
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out handoff record
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install screenshot OCR runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-eng
          command -v tesseract >/dev/null
          tesseract --list-langs 2>/dev/null | grep -Fxq "eng"

      - name: Validate changed Android preview records
        env:
          ANDROID_PREVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ANDROID_PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source scripts/workflow-output-safety.sh

          summary_header="## Android preview evidence"
          diff_output=""
          if diff_output="$(
            git diff \
              --name-only \
              --find-renames \
              --diff-filter=ACDMRT \
              "${ANDROID_PREVIEW_BASE_SHA}...${ANDROID_PREVIEW_HEAD_SHA}" \
              -- \
              "artifacts/chat-app/test-results/encrypted-room-recovery/android/**/validation-record.md" \
              "artifacts/chat-app/test-results/encrypted-room-recovery/android/**/android-preview-preflight.json"
          )"; then
            :
          else
            {
              echo "$summary_header"
              echo
              echo "- Status: **FAIL**"
              echo "- Missing-boundary reason: could not locate the pull request's changed Android preview evidence files."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Could not locate the pull request's changed Android preview evidence files." >&2
            exit 1
          fi

          changed_record_candidates=()
          changed_preflight_paths=()
          while IFS= read -r changed_path; do
            [[ -n "$changed_path" ]] || continue
            case "$changed_path" in
              */validation-record.md)
                changed_record_candidates+=("$changed_path")
                ;;
              */android-preview-preflight.json)
                record_path="${changed_path%/android-preview-preflight.json}/validation-record.md"
                changed_record_candidates+=("$record_path")
                changed_preflight_paths+=("$changed_path")
                ;;
            esac
          done < <(printf '%s\n' "$diff_output")

          if ((${#changed_record_candidates[@]} > 0)); then
            mapfile -t changed_records < <(printf '%s\n' "${changed_record_candidates[@]}" | sort -u)
          else
            changed_records=()
          fi

          if ((${#changed_records[@]} == 0)); then
            {
              echo "$summary_header"
              echo
              echo "- Status: **SKIP**"
              echo "- Changed records checked: **0**"
              echo "- Validation: **Not applicable; this pull request changed no Android preview validation record or preflight artifact.**"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "No Android preview validation records or preflight artifacts changed; nothing to validate."
            exit 0
          fi

          {
            echo "$summary_header"
            echo
            echo "- Changed records checked: **${#changed_records[@]}**"
          } >> "$GITHUB_STEP_SUMMARY"

          validator_directory="artifacts/chat-app/scripts"
          validator_file="validate-preview-startup.mjs"
          validator_path="${validator_directory}/${validator_file}"
          validator_failure_reason=""
          if [[ ! -f "$validator_path" ]]; then
            validator_failure_reason="- The Android preview evidence check is missing its delegated validator dependency boundary: ${validator_path} is not present in the checked-out commit. Restore that validator before changing the evidence record."
          fi

          overall_status=0
          for record_path in "${changed_records[@]}"; do
            record_revision="$GITHUB_SHA"
            if [[ ! -f "$record_path" ]]; then
              record_revision="$ANDROID_PREVIEW_BASE_SHA"
            fi
            record_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${record_revision}/${record_path}"
            record_result=""
            validation_output=""
            validation_status=0
            reasons=""
            preflight_path=""
            for changed_preflight_path in "${changed_preflight_paths[@]}"; do
              if [[ "$changed_preflight_path" == "${record_path%/validation-record.md}/android-preview-preflight.json" ]]; then
                preflight_path="$changed_preflight_path"
                break
              fi
            done

            if [[ ! -f "$record_path" ]]; then
              validation_status=1
              reasons="- The changed Android preview validation record is missing from the checked-out commit."
            elif [[ -n "$validator_failure_reason" ]]; then
              validation_status=1
              reasons="$validator_failure_reason"
            else
              record_result="$(
                sed -nE 's/^\*\*Result:[[:space:]]*(PASS|BLOCKED|FAIL).*/\1/p' "$record_path" |
                  head -n 1
              )"
              checker_args=("$record_path")
              if [[ -n "$preflight_path" ]]; then
                checker_args+=("$preflight_path")
              fi
              if validation_output="$(bash scripts/run-untrusted-checker.sh pnpm run validate:android-preview-evidence -- "${checker_args[@]}" 2>&1)"; then
                :
              else
                validation_status=$?
                reasons="$(printf '%s\n' "$validation_output" | sed -n '/^- /p')"
              fi
            fi

            if ((validation_status != 0)); then
              overall_status=1
              if [[ -z "$reasons" ]]; then
                reasons="- The Android preview evidence record did not satisfy the validation contract."
              fi
            fi
            safe_record_path="$(sanitize_workflow_text "$record_path")"
            safe_record_url="$(sanitize_workflow_text "$record_url")"
            safe_reasons="$(sanitize_workflow_text "$reasons")"

            {
              echo
              echo "### [${safe_record_path}](${safe_record_url})"
              if ((validation_status == 0)); then
                echo "- Validation: **PASS**"
                if [[ "$record_result" == "BLOCKED" ]]; then
                  echo "- Record result: **BLOCKED (valid)**"
                else
                  echo "- Record result: **${record_result:-Unavailable}**"
                fi
              else
                echo "- Validation: **FAIL**"
                echo "- Record result: **${record_result:-Unavailable}**"
                echo
                echo "#### Missing-boundary reason"
                printf '%s\n' "$safe_reasons"
              fi
            } >> "$GITHUB_STEP_SUMMARY"

            if ((validation_status != 0)); then
              printf '%s\n' "$safe_reasons" >&2
            fi
          done

          exit "$overall_status"

  ios-preview-evidence:
    # Keep this display name synchronized with the required check in the repository ruleset.
    name: iOS preview evidence
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out handoff record
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Validate changed iOS preview records
        env:
          IOS_PREVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IOS_PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source scripts/workflow-output-safety.sh

          summary_header="## iOS preview evidence"
          diff_output=""
          if diff_output="$(
            git diff \
              --name-only \
              --find-renames \
              --diff-filter=ACDMRT \
              "${IOS_PREVIEW_BASE_SHA}...${IOS_PREVIEW_HEAD_SHA}" \
              -- \
              "artifacts/chat-app/test-results/encrypted-room-recovery/ios/**/validation-record.md" \
              "artifacts/chat-app/test-results/encrypted-room-recovery/ios/**/ios-preview-preflight.json"
          )"; then
            :
          else
            {
              echo "$summary_header"
              echo
              echo "- Status: **FAIL**"
              echo "- Missing-boundary reason: could not locate the pull request's changed iOS preview records."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Could not locate the pull request's changed iOS preview records." >&2
            exit 1
          fi

          changed_record_candidates=()
          changed_preflight_paths=()
          while IFS= read -r changed_path; do
            [[ -n "$changed_path" ]] || continue
            case "$changed_path" in
              */validation-record.md)
                changed_record_candidates+=("$changed_path")
                ;;
              */ios-preview-preflight.json)
                record_path="${changed_path%/ios-preview-preflight.json}/validation-record.md"
                changed_record_candidates+=("$record_path")
                changed_preflight_paths+=("$changed_path")
                ;;
            esac
          done < <(printf '%s\n' "$diff_output")

          if ((${#changed_record_candidates[@]} > 0)); then
            mapfile -t changed_records < <(printf '%s\n' "${changed_record_candidates[@]}" | sort -u)
          else
            changed_records=()
          fi

          if ((${#changed_records[@]} == 0)); then
            {
              echo "$summary_header"
              echo
              echo "- Status: **SKIP**"
              echo "- Changed records checked: **0**"
              echo "- Validation: **Not applicable; this pull request changed no iOS preview validation record or preflight artifact.**"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "No iOS preview validation records or preflight artifacts changed; nothing to validate."
            exit 0
          fi

          {
            echo "$summary_header"
            echo
            echo "- Changed records checked: **${#changed_records[@]}**"
          } >> "$GITHUB_STEP_SUMMARY"

          validator_directory="artifacts/chat-app/scripts"
          validator_file="validate-preview-startup.mjs"
          validator_path="${validator_directory}/${validator_file}"
          validator_failure_reason=""
          if [[ ! -f "$validator_path" ]]; then
            validator_failure_reason="- The iOS preview evidence check is missing its delegated validator dependency boundary: ${validator_path} is not present in the checked-out commit. Restore that validator before changing the evidence record."
          fi

          overall_status=0
          for record_path in "${changed_records[@]}"; do
            record_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/${record_path}"
            record_result=""
            validation_output=""
            validation_status=0
            reasons=""
            preflight_path=""
            for changed_preflight_path in "${changed_preflight_paths[@]}"; do
              if [[ "$changed_preflight_path" == "${record_path%/validation-record.md}/ios-preview-preflight.json" ]]; then
                preflight_path="$changed_preflight_path"
                break
              fi
            done

            if [[ ! -f "$record_path" ]]; then
              validation_status=1
              reasons="- The changed iOS preview validation record is missing from the checked-out commit."
            elif [[ -n "$validator_failure_reason" ]]; then
              validation_status=1
              reasons="$validator_failure_reason"
            else
              record_result="$(
                sed -nE 's/^\*\*Result:[[:space:]]*(PASS|BLOCKED|FAIL).*/\1/p' "$record_path" |
                  head -n 1
              )"
              checker_args=("$record_path")
              if [[ -n "$preflight_path" ]]; then
                checker_args+=("$preflight_path")
              fi
              if validation_output="$(bash scripts/run-untrusted-checker.sh pnpm run validate:ios-preview-evidence -- "${checker_args[@]}" 2>&1)"; then
                :
              else
                validation_status=$?
                reasons="$(printf '%s\n' "$validation_output" | sed -n '/^- /p')"
              fi
            fi

            if ((validation_status != 0)); then
              overall_status=1
              if [[ -z "$reasons" ]]; then
                reasons="- The iOS preview evidence record did not satisfy the validation contract."
              fi
            fi
            safe_record_path="$(sanitize_workflow_text "$record_path")"
            safe_record_url="$(sanitize_workflow_text "$record_url")"
            safe_reasons="$(sanitize_workflow_text "$reasons")"

            {
              echo
              echo "### [${safe_record_path}](${safe_record_url})"
              if ((validation_status == 0)); then
                echo "- Validation: **PASS**"
                case "$record_result" in
                  BLOCKED)
                    echo "- Record result: **BLOCKED (valid physical-phone handoff unavailable)**"
                    ;;
                  FAIL)
                    echo "- Record result: **FAIL (public edge)**"
                    ;;
                  *)
                    echo "- Record result: **${record_result:-Unavailable}**"
                    ;;
                esac
              else
                echo "- Validation: **FAIL**"
                echo "- Record result: **${record_result:-Unavailable}**"
                echo
                echo "#### Missing-boundary reason"
                printf '%s\n' "$safe_reasons"
              fi
            } >> "$GITHUB_STEP_SUMMARY"

            if ((validation_status != 0)); then
              printf '%s\n' "$safe_reasons" >&2
            fi
          done

          exit "$overall_status"

  native-evidence-summary-regression:
    name: Native evidence summary regression
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - mobile-release-node-range
      - mobile-release-credentials
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Upload controlled Android artifact for missing iOS scenario
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$RUNNER_TEMP/native-evidence-summary-download-fixture"
          rm -rf -- "$fixture_root"
          mkdir -p -- "$fixture_root/android"
          printf 'controlled Android artifact\n' > "$fixture_root/android/controlled-marker.txt"

      - name: Store controlled Android artifact for missing iOS scenario
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-evidence-summary-controlled-android
          path: ${{ runner.temp }}/native-evidence-summary-download-fixture/android/**
          if-no-files-found: error

      - name: Download controlled missing iOS artifact
        if: ${{ always() }}
        continue-on-error: true
        id: download-controlled-ios
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-evidence-summary-controlled-ios
          path: ${{ runner.temp }}/native-evidence-summary-downloads/ios

      - name: Download controlled Android artifact after iOS failure
        if: ${{ always() }}
        continue-on-error: true
        id: download-controlled-android
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-evidence-summary-controlled-android
          path: ${{ runner.temp }}/native-evidence-summary-downloads/android

      - name: Run checker after controlled artifact outage
        if: ${{ always() }}
        continue-on-error: true
        id: controlled-artifact-check
        env:
          REVIEWED_REF: ${{ github.ref }}
          NATIVE_IOS_EVIDENCE_ARTIFACT_URL: ""
          NATIVE_ANDROID_EVIDENCE_ARTIFACT_URL: ""
          NATIVE_IOS_EVIDENCE_DOWNLOAD_RESULT: ${{ steps.download-controlled-ios.outcome }}
          NATIVE_ANDROID_EVIDENCE_DOWNLOAD_RESULT: ${{ steps.download-controlled-android.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          controlled_summary_path="$RUNNER_TEMP/native-evidence-summary-controlled.md"
          rm -f -- "$controlled_summary_path"
          resolved_commit_sha="$(git rev-parse --verify HEAD)"

          {
            echo "## Reviewed release revision"
            echo
            printf -- '- Checked ref: `%s`\n' "$REVIEWED_REF"
            printf -- '- Resolved commit SHA: `%s`\n' "$resolved_commit_sha"
            echo
            echo "## Controlled native artifact outage"
            echo "- Scenario: iOS artifact missing; Android artifact available"
          } >> "$GITHUB_STEP_SUMMARY"

          GITHUB_STEP_SUMMARY="$controlled_summary_path" \
            bash scripts/run-untrusted-checker.sh bash scripts/check-native-large-text-evidence.sh \
            "$RUNNER_TEMP/native-evidence-summary-downloads"

      - name: Confirm controlled outage blocks promotion and preserves both sections
        if: ${{ always() }}
        env:
          CHECK_RESULT: ${{ steps.controlled-artifact-check.outcome }}
          IOS_DOWNLOAD_RESULT: ${{ steps.download-controlled-ios.outcome }}
          ANDROID_DOWNLOAD_RESULT: ${{ steps.download-controlled-android.outcome }}
          CONTROLLED_SUMMARY_PATH: ${{ runner.temp }}/native-evidence-summary-controlled.md
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IOS_DOWNLOAD_RESULT" != "failure" ]]; then
            echo "The controlled iOS artifact download unexpectedly succeeded." >&2
            exit 1
          fi
          if [[ "$ANDROID_DOWNLOAD_RESULT" != "success" ]]; then
            echo "The Android download did not continue successfully after the iOS failure." >&2
            exit 1
          fi
          if [[ "$CHECK_RESULT" != "failure" ]]; then
            echo "The native evidence checker did not block the controlled outage." >&2
            exit 1
          fi

          ios_section="$(
            awk '
              /^## iOS native large-text evidence$/ { collecting=1 }
              /^## Android native large-text evidence$/ { collecting=0 }
              collecting { print }
            ' "$CONTROLLED_SUMMARY_PATH"
          )"
          android_section="$(
            awk '
              /^## Android native large-text evidence$/ { collecting=1 }
              collecting { print }
            ' "$CONTROLLED_SUMMARY_PATH"
          )"

          require_contains() {
            local section="$1"
            local expected="$2"
            if ! grep -Fq -- "$expected" <<< "$section"; then
              echo "Expected controlled outage summary to contain: $expected" >&2
              exit 1
            fi
          }

          require_not_contains() {
            local section="$1"
            local unexpected="$2"
            if grep -Fq -- "$unexpected" <<< "$section"; then
              echo "Controlled outage summary contained cross-platform detail: $unexpected" >&2
              exit 1
            fi
          }

          require_contains "$ios_section" "- Status: **FAIL**"
          require_contains "$ios_section" "- Artifact download: **FAIL**"
          require_contains "$ios_section" "Rerun the iOS native large-text job"
          require_not_contains "$ios_section" "$RUNNER_TEMP/native-evidence-summary-downloads/android"

          require_contains "$android_section" "- Status: **FAIL**"
          require_contains "$android_section" "- Artifact download: **PASS**"
          require_contains "$android_section" "No timestamped evidence run directory exists"
          require_not_contains "$android_section" "$RUNNER_TEMP/native-evidence-summary-downloads/ios"

          {
            echo
            echo "- Download continuation: **PASS** (Android completed after the iOS failure)"
            echo "- Promotion blocker: **PASS** (checker returned failure)"
            echo "- Recovery: **Rerun the failed native job or make its artifact available, then rerun the mobile release gate.**"
            cat "$CONTROLLED_SUMMARY_PATH"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify blocked native evidence summary
        env:
