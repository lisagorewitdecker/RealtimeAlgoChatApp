            printf -- '- Resolved commit SHA: `%s`\n' "$resolved_commit_sha"
          } >> "$GITHUB_STEP_SUMMARY"

          if \
            GITHUB_STEP_SUMMARY="$summary_path" \
            NATIVE_IOS_EVIDENCE_DOWNLOAD_RESULT=failure \
            NATIVE_ANDROID_EVIDENCE_DOWNLOAD_RESULT=success \
            NATIVE_ANDROID_EVIDENCE_ARTIFACT_URL="https://github.example/example/chat-app/actions/runs/123/artifacts/456" \
            bash scripts/run-untrusted-checker.sh bash scripts/check-native-large-text-evidence.sh "$failed_download_root"; then
            echo "The failed native evidence download scenario unexpectedly passed." >&2
            exit 1
          fi

          ios_section="$(
            awk '
              /^## iOS native large-text evidence$/ { collecting=1 }
              /^## Android native large-text evidence$/ { collecting=0 }
              collecting { print }
            ' "$summary_path"
          )"
          android_section="$(
            awk '
              /^## Android native large-text evidence$/ { collecting=1 }
              collecting { print }
            ' "$summary_path"
          )"

          require_contains() {
            local section="$1"
            local expected="$2"
            if ! grep -Fq -- "$expected" <<< "$section"; then
