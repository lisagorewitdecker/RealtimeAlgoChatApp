# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main", "development" ]
  schedule:
    - cron: '43 3 * * 2'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      - name: Ensure unique SARIF run categories
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from collections import Counter


          def slug(value):
            return re.sub(r"[^a-z0-9._-]+", "-", value.strip().lower()).strip("-") or "tool"


          def stable_tool_key(run):
            tool = run.get("tool", {})
            driver = tool.get("driver", {})
            extensions = tool.get("extensions", [])

            parts = [
              driver.get("name"),
              driver.get("guid"),
              driver.get("semanticVersion") or driver.get("version"),
            ]

            for extension in extensions:
              parts.extend(
                [
                  extension.get("name"),
                  extension.get("guid"),
                  extension.get("semanticVersion") or extension.get("version"),
                ]
              )

            slugged_parts = [slug(part) for part in parts if isinstance(part, str) and part.strip()]
            if slugged_parts:
              return "-".join(slugged_parts)

            digest = hashlib.sha256(
              json.dumps(tool, sort_keys=True).encode("utf-8")
            ).hexdigest()[:12]
            return f"tool-{digest}"


          def normalized_automation_id(automation_details):
            automation_id = automation_details.get("id")
            if isinstance(automation_id, str) and automation_id:
              return automation_id
            return None


          def normalized_category_id(value):
            normalized_value = re.sub(r"[^a-z0-9._/-]+", "-", value.strip().lower())
            normalized_value = re.sub(r"/+", "/", normalized_value).strip("/-")
            return normalized_value or None

          with open("results.sarif", "r", encoding="utf-8") as sarif_file:
            sarif_data = json.load(sarif_file)

          runs = sarif_data.get("runs", [])
          for run in runs:
            if not isinstance(run.get("automationDetails"), dict):
              run["automationDetails"] = {}

          existing_ids = [
            normalized_automation_id(run["automationDetails"])
            for run in runs
            if normalized_automation_id(run["automationDetails"])
          ]
          duplicate_existing_ids = {
            automation_id for automation_id, count in Counter(existing_ids).items() if count > 1
          }
          assigned_ids = set()

          for run in runs:
            automation_details = run["automationDetails"]
            automation_id = normalized_automation_id(automation_details)
            if automation_id and automation_id not in duplicate_existing_ids and automation_id not in assigned_ids:
              assigned_ids.add(automation_id)
              continue

            tool_key = stable_tool_key(run)
            normalized_id = normalized_category_id(automation_id) if automation_id else None
            candidate_id = f"{normalized_id}/{tool_key}" if normalized_id else f"codacy/{tool_key}"
            if candidate_id in assigned_ids:
              run_digest = hashlib.sha256(
                json.dumps(run, sort_keys=True).encode("utf-8")
              ).hexdigest()[:12]
              candidate_id = f"{candidate_id}-{run_digest}"

            automation_details["id"] = candidate_id
            assigned_ids.add(candidate_id)

          with open("results.sarif", "w", encoding="utf-8") as sarif_file:
            json.dump(sarif_data, sarif_file)
          PY

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          sarif_file: results.sarif
