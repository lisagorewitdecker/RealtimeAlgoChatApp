name: Native evidence summary regression

on:
  pull_request:
    paths:
      - .github/workflows/native-evidence-summary-regression.yml
      - scripts/check-native-large-text-evidence.sh
      - scripts/run-untrusted-checker.sh
      - scripts/tests/native-evidence-summary-regression-fixture.sh
  workflow_dispatch:
    inputs:
      reviewed_ref:
        description: Git branch, tag, or commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-hosted-summary:
    name: Verify hosted native evidence summary
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.reviewed_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify unavailable iOS and Android summaries
        shell: bash
        env:
          REVIEWED_REF: ${{ github.event.pull_request.head.sha || inputs.reviewed_ref }}
          NATIVE_EVIDENCE_HOSTILE_METADATA: "1"
        run: |
          bash scripts/tests/native-evidence-summary-regression-fixture.sh \
            bash scripts/check-native-large-text-evidence.sh
