name: API generated clients

on:
  push:
    branches: ["development"]
  pull_request:
    branches: ["development"]

jobs:
  check-generated:
    name: Check generated API clients
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API clients
        run: pnpm validate:api-codegen

      # Breaking contract changes fail this step unless the pull request
      # description declares both pieces of review evidence, each on its own line:
      #   API_BREAKING_CHANGE_JUSTIFICATION: <why the existing contract must break>
      #   API_BREAKING_CHANGE_MIGRATION_PLAN: <how existing consumers move to the new contract>
      # An override that omits either line is rejected.
      - name: Check API contract compatibility
        env:
          API_BREAKING_CHANGE_PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm validate:api-compatibility
