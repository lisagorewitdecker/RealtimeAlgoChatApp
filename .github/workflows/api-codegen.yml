name: API generated clients

on:
  push:
    branches: ["development"]
  pull_request:
    branches: ["development"]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  # Publishing the drift evidence as its own check run keeps it readable from
  # the pull request's Checks tab, which needs no job-log access.
  checks: write

jobs:
  check-generated:
    name: Check generated API clients
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        id: setup-pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.26.1

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        id: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API clients
        id: verify-generated
        env:
          API_CODEGEN_DRIFT_REPORT_PATH: ${{ runner.temp }}/api-codegen-drift-report.txt
        run: pnpm validate:api-codegen

      - name: Upload generated-client drift artifact
        if: ${{ always() && github.event_name == 'pull_request' && steps.verify-generated.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-client-drift-report
          path: ${{ runner.temp }}/api-codegen-drift-report.txt
          if-no-files-found: ignore
          retention-days: 1

      # Reviewers must be able to read the drift evidence from the Checks tab,
      # so it is published as a check-run summary rather than only as this
      # job's step summary, which GitHub shows only to signed-in viewers.
      - name: Publish generated-client drift evidence
        if: ${{ always() && steps.verify-generated.outcome == 'failure' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_CODEGEN_DRIFT_REPORT_PATH: ${{ runner.temp }}/api-codegen-drift-report.txt
          API_CODEGEN_DRIFT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node lib/api-spec/scripts/publish-drift-check.mjs

      - name: Verify generated API-break guidance
        run: pnpm validate:api-break-guidance

      # For an intentional versioned break, add both declarations to the pull request description.
      # Inline example:
      #   API_BREAKING_CHANGE_JUSTIFICATION: <why the existing contract must break>
      #   API_BREAKING_CHANGE_MIGRATION_PLAN: <how existing consumers move to the new contract>
      #
      # Multi-step migration plan example:
      #   API_BREAKING_CHANGE_MIGRATION_PLAN:
      #     - Release the updated client first.
      #     - Keep the old API available during migration.
      #     - Remove the old API after adoption is confirmed.
      #   (End the block with a blank line or the next API_BREAKING_CHANGE_* marker.)
      # Pull request runs reject breaking changes when either declaration is absent.
      # Push runs skip compatibility enforcement because the change was enforced
      # on its pull request before merge, and print that reason in the log and job
      # summary. Every decision is published through GITHUB_STEP_SUMMARY.
      - name: Check API contract compatibility
        if: >-
          ${{
            always() &&
            steps.checkout.outcome == 'success' &&
            steps.setup-pnpm.outcome == 'success' &&
            steps.setup-node.outcome == 'success' &&
            steps.install-dependencies.outcome == 'success'
          }}
        env:
          API_BREAKING_CHANGE_PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm validate:api-compatibility
