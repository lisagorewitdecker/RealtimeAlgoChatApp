name: API generated-client drift evidence

on:
  workflow_run:
    workflows: ["API generated clients"]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read

jobs:
  publish-generated-client-drift:
    name: Publish generated-client drift evidence
    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'failure'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted repository code
        uses: actions/checkout@v5

      - name: Download generated-client drift artifact
        id: download-drift
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: generated-client-drift-report
          path: ${{ runner.temp }}/generated-client-drift

      - name: Skip when no generated-client drift artifact exists
        if: ${{ steps.download-drift.outcome != 'success' }}
        run: echo "No generated-client drift artifact was published for this run; nothing to publish."

      - name: Publish generated-client drift evidence
        if: ${{ steps.download-drift.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_CODEGEN_DRIFT_REPORT_PATH: ${{ runner.temp }}/generated-client-drift/drift-report.txt
          API_CODEGEN_DRIFT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node lib/api-spec/scripts/publish-drift-check.mjs
