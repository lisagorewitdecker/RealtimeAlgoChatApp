# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# EthicalCheck addresses the critical need to continuously security test APIs in development and in production.

# EthicalCheck provides the industry’s only free & automated API security testing service that uncovers security vulnerabilities using OWASP API list.
# Developers rely on EthicalCheck to evaluate every update and release, ensuring that no APIs go to production with exploitable vulnerabilities.

# You develop the application and API, we bring complete and continuous security testing to you, accelerating development.

# Know your API and Applications are secure with EthicalCheck – our free & automated API security testing service.

# How EthicalCheck works?
# EthicalCheck functions in the following simple steps.
# 1. Security Testing.
# Provide your OpenAPI specification or start with a public Postman collection URL.
# EthicalCheck instantly introspects your API and creates a map of API endpoints for security testing.
# It then automatically creates hundreds of security tests that are non-intrusive to comprehensively and completely test for authentication, authorizations, and OWASP bugs your API. The tests addresses the OWASP API Security categories including OAuth 2.0, JWT, Rate Limit etc.

# 2. Reporting.
# EthicalCheck generates security test report that includes all the tested endpoints, coverage graph, exceptions, and vulnerabilities.
# Vulnerabilities are fully triaged, it contains CVSS score, severity, endpoint information, and OWASP tagging.


# This is a starter workflow to help you get started with EthicalCheck Actions

name: EthicalCheck-Workflow

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "production" branch
  # Customize trigger events based on your DevSecOps processes.
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]
  schedule:
    - cron: '34 6 * * 2'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      run_live_assistant:
        description: Run the managed sandbox assistant health check
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  managed-assistant-health:
    name: Managed sandbox assistant health
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_live_assistant == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run managed sandbox assistant health check
        env:
          AI_INTEGRATIONS_ANTHROPIC_API_KEY: ${{ secrets.AI_INTEGRATIONS_ANTHROPIC_API_KEY }}
          AI_INTEGRATIONS_ANTHROPIC_BASE_URL: ${{ secrets.AI_INTEGRATIONS_ANTHROPIC_BASE_URL }}
          LIVE_ASSISTANT_CHECK: "1"
        run: |
          set -euo pipefail
          output_path="$RUNNER_TEMP/managed-assistant-health.log"
          status=0

          # Keep provider diagnostics out of the workflow log. The test itself
          # uses a fixed prompt, but SDK failures can contain request details.
          timeout --signal=TERM 120s \
            pnpm --filter @workspace/api-server run test:live-assistant \
            >"$output_path" 2>&1 || status=$?

          if [[ "$status" -ne 0 ]]; then
            echo "::error::Managed sandbox assistant health check failed."
            echo "The managed assistant did not complete a healthy response within 120 seconds or reported an unavailable response."
            exit "$status"
          fi

          echo "Managed sandbox assistant health check passed."

  Trigger_EthicalCheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: EthicalCheck  Free & Automated API Security Testing Service
        uses: Octota-GitHub/ethicalcheck-action@3ec5e93b42e591349e46635da9f909bac66c23a9
        with:
          # The OpenAPI Specification URL or Swagger Path or Public Postman collection URL.
          oas-url: ${{ vars.ETHICALCHECK_OAS_URL }}
          # The email address to which the penetration test report will be sent.
          email: ${{ secrets.ETHICALCHECK_REPORT_EMAIL }}
